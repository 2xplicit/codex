<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Wallet Dashboard</title>
<style>
    :root {
        --blue: #2563EB;
        --blue-dark: #1D4ED8;
        --blue-light: #3B82F6;
        --green: #10b981;
        --red: #ef4444;
        --bg: #f1f5f9;
        --bg-secondary: #e2e8f0;
        --text: #0f172a;
        --text-sec: #64748b;
        --text-tertiary: #94a3b8;
        --glass-bg: rgba(255, 255, 255, 0.65);
        --glass-border: rgba(255, 255, 255, 0.8);
        --card-bg: rgba(255, 255, 255, 0.5);
        --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
        --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
        --shadow-lg: 0 8px 32px rgba(15, 23, 42, 0.12);
        --shadow-xl: 0 20px 48px rgba(15, 23, 42, 0.16);
        --radius-sm: 12px;
        --radius-md: 16px;
        --radius-lg: 20px;
        --radius-xl: 24px;
        --radius-2xl: 28px;
        --radius-3xl: 32px;
    }
    
    [data-theme="dark"] {
        --bg: #0a0f1e;
        --bg-secondary: #111827;
        --text: #f8fafc;
        --text-sec: #94a3b8;
        --text-tertiary: #64748b;
        --glass-bg: rgba(17, 24, 39, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --card-bg: rgba(30, 41, 59, 0.4);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
        --shadow-xl: 0 20px 48px rgba(0, 0, 0, 0.6);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                    color 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                    border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                    transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        line-height: 1.5;
    }

    body::before {
        content: '';
        position: fixed;
        top: -20%;
        left: -10%;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(60px);
        z-index: 0;
        pointer-events: none;
    }

    body::after {
        content: '';
        position: fixed;
        bottom: -20%;
        right: -10%;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(29, 78, 216, 0.12) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(60px);
        z-index: 0;
        pointer-events: none;
    }

    .container {
        max-width: 428px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 0 16px 100px;
        position: relative;
        z-index: 1;
    }

    .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        box-shadow: var(--shadow-lg);
    }

    .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        box-shadow: var(--shadow-md);
    }

    .gradient-circle {
        background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .gradient-badge {
        background: linear-gradient(135deg, var(--blue-light) 0%, var(--blue) 100%);
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    button {
        cursor: pointer;
        border: none;
        background: none;
        font-family: inherit;
        font-size: inherit;
        color: inherit;
    }

    .btn-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }

    .btn-icon:active {
        transform: scale(0.92);
    }

    .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-xl);
    }

    .hover-lift:active {
        transform: translateY(0);
    }

    /* Header */
    .header {
        margin-top: 16px;
        padding: 16px;
        border-radius: var(--radius-xl);
        display: flex;
        align-items: center;
        justify-content: space-between;
        animation: slideDown 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logo {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
        color: white;
    }

    .header-title h1 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
    }

    .wallet-dropdown {
        position: relative;
        display: inline-block;
    }

    .wallet-btn {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--blue);
        font-weight: 600;
        padding: 2px 0;
    }

    .dropdown-arrow {
        width: 14px;
        height: 14px;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dropdown-menu {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        min-width: 160px;
        border-radius: var(--radius-md);
        padding: 8px;
        z-index: 50;
        opacity: 0;
        transform: translateY(-8px) scale(0.95);
        pointer-events: none;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dropdown-menu.show {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: all;
    }

    .dropdown-item {
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        transition: background 0.15s ease;
    }

    .dropdown-item:hover {
        background: rgba(37, 99, 235, 0.08);
    }

    [data-theme="dark"] .dropdown-item:hover {
        background: rgba(59, 130, 246, 0.15);
    }

    .header-actions {
        display: flex;
        gap: 8px;
    }

    .notification-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 8px;
        height: 8px;
        background: var(--red);
        border-radius: 50%;
        border: 2px solid var(--glass-bg);
    }

    /* Balance Card */
    .balance-card {
        margin-top: 20px;
        padding: 24px;
        border-radius: var(--radius-3xl);
        animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.1s backwards;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .balance-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 16px;
    }

    .balance-label {
        font-size: 13px;
        color: var(--text-sec);
        font-weight: 500;
        margin-bottom: 6px;
    }

    .balance-amount {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
    }

    .balance-badge {
        padding: 6px 14px;
        border-radius: 20px;
        color: white;
        font-size: 14px;
        font-weight: 700;
    }

    .balance-change {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
    }

    .change-positive {
        color: var(--green);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .change-label {
        color: var(--text-tertiary);
        font-size: 13px;
    }

    /* Quick Actions */
    .quick-actions {
        margin-top: 24px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.2s backwards;
    }

    .action-btn {
        border-radius: var(--radius-xl);
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        position: relative;
        overflow: hidden;
    }

    .action-icon {
        width: 52px;
        height: 52px;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .action-icon.gradient {
        color: white;
    }

    .action-icon.outline {
        background: rgba(37, 99, 235, 0.1);
        color: var(--blue);
    }

    [data-theme="dark"] .action-icon.outline {
        background: rgba(59, 130, 246, 0.15);
    }

    .action-label {
        font-size: 14px;
        font-weight: 600;
    }

    /* Ripple Effect */
    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        transform: scale(0);
        animation: ripple-effect 0.6s ease-out;
        pointer-events: none;
    }

    @keyframes ripple-effect {
        to {
            transform: scale(4);
            opacity: 0;
        }
    }

    /* Tabs */
    .tabs-container {
        margin-top: 32px;
        position: relative;
        animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.3s backwards;
    }

    .tabs {
        display: flex;
        gap: 8px;
        padding: 4px;
        background: var(--card-bg);
        border-radius: var(--radius-lg);
        position: relative;
        border: 1px solid var(--glass-border);
    }

    .tab-btn {
        flex: 1;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        position: relative;
        z-index: 2;
        transition: color 0.3s ease;
    }

    .tab-btn.active {
        color: white;
    }

    .tab-btn:not(.active) {
        color: var(--text-sec);
    }

    .tab-indicator {
        position: absolute;
        height: calc(100% - 8px);
        top: 4px;
        background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
        border-radius: 12px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    /* Coin Cards - UPDATED FOR VERTICAL STACK */
    .content {
        margin-top: 20px;
        animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.4s backwards;
    }

    .coins-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .coin-card {
        padding: 28px 24px;
        border-radius: var(--radius-xl);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 20px;
    }

    .coin-top {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
    }

    .coin-icon {
        width: 64px;
        height: 64px;
        border-radius: var(--radius-lg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 20px;
        color: white;
    }

    .coin-icon.astron {
        background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
    }

    .coin-icon.bitron {
        background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
    }

    .coin-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }

    .coin-info h3 {
        font-size: 18px;
        font-weight: 700;
    }

    .coin-amount {
        font-size: 28px;
        color: var(--text);
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .coin-stats {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding-top: 20px;
        border-top: 1px solid rgba(148, 163, 184, 0.15);
    }

    [data-theme="dark"] .coin-stats {
        border-top-color: rgba(255, 255, 255, 0.08);
    }

    .coin-change-row {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
    }

    .coin-change {
        font-size: 15px;
        font-weight: 700;
    }

    .sparkline {
        width: 100%;
        max-width: 200px;
        height: 40px;
    }

    .sparkline-label {
        font-size: 12px;
        color: var(--text-tertiary);
        font-weight: 500;
    }

    /* Funds Empty State */
    .empty-state {
        padding: 48px 24px;
        border-radius: var(--radius-xl);
        text-align: center;
    }

    .empty-icon {
        width: 72px;
        height: 72px;
        border-radius: var(--radius-lg);
        background: var(--bg-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
    }

    [data-theme="dark"] .empty-icon {
        background: rgba(255, 255, 255, 0.05);
    }

    .empty-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .empty-text {
        font-size: 14px;
        color: var(--text-sec);
    }

    /* Bottom Navigation */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
        border-top: 1px solid var(--glass-border);
    }

    .bottom-nav-inner {
        max-width: 428px;
        margin: 0 auto;
        padding: 12px 16px 16px;
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }

    .nav-items {
        display: flex;
        justify-content: space-around;
        align-items: center;
    }

    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 16px;
        border-radius: var(--radius-md);
        transition: all 0.2s ease;
    }

    .nav-item:active {
        transform: scale(0.9);
    }

    .nav-item.active {
        color: var(--blue);
    }

    .nav-item:not(.active) {
        color: var(--text-sec);
    }

    .nav-icon {
        width: 24px;
        height: 24px;
        transition: transform 0.2s ease;
    }

    .nav-item.active .nav-icon {
        transform: scale(1.1);
    }

    .nav-label {
        font-size: 11px;
        font-weight: 600;
    }

    .hidden {
        display: none !important;
    }

    @media (max-width: 360px) {
        .balance-amount {
            font-size: 36px;
        }
        .quick-actions {
            gap: 8px;
        }
        .coin-amount {
            font-size: 24px;
        }
    }
</style>
</head>

<script>
(function() {
    'use strict';

    // Theme Management
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');
    const html = document.documentElement;
    
    const getStoredTheme = () => {
        try {
            return localStorage.getItem('codex-theme') || 'light';
        } catch(e) {
            return 'light';
        }
    };
    
    const setStoredTheme = (theme) => {
        try {
            localStorage.setItem('codex-theme', theme);
        } catch(e) {}
    };
    
    const applyTheme = (theme) => {
        html.setAttribute('data-theme', theme);
        if (theme === 'dark') {
            sunIcon.classList.add('hidden');
            moonIcon.classList.remove('hidden');
        } else {
            sunIcon.classList.remove('hidden');
            moonIcon.classList.add('hidden');
        }
    };
    
    const currentTheme = getStoredTheme();
    applyTheme(currentTheme);
    
    themeToggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const newTheme = current === 'light' ? 'dark' : 'light';
        applyTheme(newTheme);
        setStoredTheme(newTheme);
    });

    // Wallet Dropdown
    const walletBtn = document.getElementById('wallet-btn');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const dropdownArrow = document.getElementById('dropdown-arrow');
    const walletName = document.getElementById('wallet-name');
    
    walletBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isShowing = dropdownMenu.classList.contains('show');
        dropdownMenu.classList.toggle('show');
        dropdownArrow.style.transform = isShowing ? 'rotate(0deg)' : 'rotate(180deg)';
        walletBtn.setAttribute('aria-expanded', !isShowing);
    });
    
    document.addEventListener('click', () => {
        dropdownMenu.classList.remove('show');
        dropdownArrow.style.transform = 'rotate(0deg)';
        walletBtn.setAttribute('aria-expanded', 'false');
    });
    
    dropdownMenu.addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.target.classList.contains('dropdown-item')) {
            walletName.textContent = e.target.dataset.wallet;
            dropdownMenu.classList.remove('show');
            dropdownArrow.style.transform = 'rotate(0deg)';
            walletBtn.setAttribute('aria-expanded', 'false');
        }
    });

    // Tabs with Sliding Indicator
    const tabs = document.getElementById('tabs');
    const tabBtns = tabs.querySelectorAll('.tab-btn');
    const tabIndicator = document.getElementById('tab-indicator');
    const coinsContent = document.getElementById('coins-content');
    const fundsContent = document.getElementById('funds-content');
    
    function updateIndicator(activeBtn) {
        const rect = activeBtn.getBoundingClientRect();
        const parentRect = tabs.getBoundingClientRect();
        tabIndicator.style.width = rect.width + 'px';
        tabIndicator.style.left = (rect.left - parentRect.left) + 'px';
    }
    
    // Initialize indicator
    setTimeout(() => {
        const activeBtn = document.querySelector('.tab-btn.active');
        updateIndicator(activeBtn);
    }, 100);
    
    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.tab;
            
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateIndicator(btn);
            
            if (tab === 'coins') {
                coinsContent.classList.remove('hidden');
                fundsContent.classList.add('hidden');
            } else {
                coinsContent.classList.add('hidden');
                fundsContent.classList.remove('hidden');
            }
        });
    });
    
    window.addEventListener('resize', () => {
        const activeBtn = document.querySelector('.tab-btn.active');
        if (activeBtn) updateIndicator(activeBtn);
    });

    // Animated Count-up for Balance
    const balanceEl = document.getElementById('balance-amount');
    
    function animateValue(start, end, duration, formatter) {
        const startTime = performance.now();
        
        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeOut = 1 - Math.pow(1 - progress, 3);
            const current = start + (end - start) * easeOut;
            balanceEl.textContent = formatter(current);
            
            if (progress < 1) {
                requestAnimationFrame(update);
            }
        }
        
        requestAnimationFrame(update);
    }
    
    setTimeout(() => {
        animateValue(0, 158300000, 1800, (val) => {
            return '$' + (val / 1000000).toFixed(1) + 'M';
        });
    }, 300);

    // Ripple Effect
    document.querySelectorAll('.action-btn, .hover-lift').forEach(btn => {
        btn.addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;
            
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    });

    // Bottom Navigation
    const navItems = document.querySelectorAll('.nav-item');
    
    navItems.forEach(item => {
        item.addEventListener('click', () => {
            navItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
        });
    });

    // Prevent double-tap zoom on iOS
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            e.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

})();
</script>
