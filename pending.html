<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Status - 2026 Redesign</title>
<style>
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}
@property --progress {
  syntax: '<percentage>';
  initial-value: 0%;
  inherits: true;
}
@property --glow-opacity {
  syntax: '<number>';
  initial-value: 0;
  inherits: false;
}

:root {
  --bg: #020617;
  --card: #0F172A;
  --card-border: rgba(255,255,255,0.08);
  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-tertiary: #64748B;
  --amber: #F59E0B;
  --emerald: #10B981;
  --info: #3B82F6;
  --danger: #EF4444;
  --glass: rgba(15,23,42,0.6);
  --shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
  --radius-lg: 36px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --system: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

[data-theme="light"] {
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --card-border: rgba(2,6,23,0.08);
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-tertiary: #64748B;
  --glass: rgba(255,255,255,0.6);
  --shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--system);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-image: 
    radial-gradient(at 20% 20%, rgba(59,130,246,0.15) 0px, transparent 50%),
    radial-gradient(at 80% 80%, rgba(245,158,11,0.1) 0px, transparent 50%),
    radial-gradient(at 50% 50%, rgba(16,185,129,0.05) 0px, transparent 50%);
  transition: background 0.4s ease, color 0.3s ease;
}

.container {
  width: 100%;
  max-width: 32rem;
  position: relative;
}

.theme-toggle {
  position: absolute;
  top: -60px;
  right: 0;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--glass);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}

.theme-toggle:hover {
  transform: scale(1.05);
  border-color: var(--info);
}

.theme-toggle svg {
  width: 22px;
  height: 22px;
  color: var(--text-primary);
  transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
}

.theme-toggle:active svg {
  transform: rotate(180deg) scale(0.8);
}

.progress-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--card);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  overflow: hidden;
}

.progress-bar::before {
  content: '';
  position: absolute;
  inset: 0;
  width: var(--progress);
  background: linear-gradient(90deg, var(--amber), var(--info));
  transition: --progress 2s cubic-bezier(0.4,0,0.2,1);
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0% { filter: brightness(1); }
  50% { filter: brightness(1.3); }
  100% { filter: brightness(1); }
}

.card {
  background: var(--glass);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 48px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: scale(0.9) translateY(20px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.card::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: var(--radius-lg);
  padding: 2px;
  background: conic-gradient(from var(--angle), var(--amber), var(--info), var(--emerald), var(--amber));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: rotate 4s linear infinite;
  opacity: 0.4;
}

@keyframes rotate {
  to { --angle: 360deg; }
}

.status-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
  animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) 0.1s both;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.info-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(245,158,11,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}

.info-icon::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 2px solid var(--amber);
  opacity: 0;
  animation: ringPulse 2s cubic-bezier(0.4,0,0.2,1) infinite;
}

@keyframes ringPulse {
  0% {
    transform: scale(0.8);
    opacity: 0.6;
  }
  100% {
    transform: scale(1.3);
    opacity: 0;
  }
}

.info-icon svg {
  width: 28px;
  height: 28px;
  color: var(--amber);
  z-index: 1;
}

.status-text {
  flex: 1;
}

.status-title {
  font-size: 28px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  line-height: 1.2;
}

.pulse-dot {
  width: 10px;
  height: 10px;
  background: var(--amber);
  border-radius: 50%;
  animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.5;
    transform: scale(1.1);
  }
}

.ellipsis::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%, 20% { content: ''; }
  40% { content: '.'; }
  60% { content: '..'; }
  80%, 100% { content: '...'; }
}

.divider {
  height: 1px;
  background: var(--card-border);
  margin: 32px 0;
  animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) 0.2s both;
}

.section {
  animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) 0.3s both;
}

.label {
  font-size: 14px;
  color: var(--text-secondary);
  font-weight: 500;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.code-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
}

.code {
  font-family: var(--mono);
  font-size: 48px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--amber), var(--info));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  flex: 1;
}

.copy-btn {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--glass);
  border: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}

.code-wrapper:hover .copy-btn {
  opacity: 1;
  transform: scale(1);
}

.copy-btn:hover {
  background: var(--info);
  border-color: var(--info);
}

.copy-btn svg {
  width: 18px;
  height: 18px;
  color: var(--text-primary);
  transition: color 0.2s;
}

.copy-btn:hover svg {
  color: white;
}

.increase-badge {
  margin-top: 16px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.3);
  border-radius: var(--radius-md);
  position: relative;
  overflow: hidden;
}

.increase-badge::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(16,185,129,0.2) 0%, transparent 100%);
  width: var(--progress);
  transition: --progress 1.5s cubic-bezier(0.4,0,0.2,1) 0.5s;
}

.increase-badge svg {
  width: 20px;
  height: 20px;
  color: var(--emerald);
  z-index: 1;
  animation: glow 2s ease-in-out infinite;
}

@keyframes glow {
  0%, 100% { filter: drop-shadow(0 0 2px var(--emerald)); }
  50% { filter: drop-shadow(0 0 8px var(--emerald)); }
}

.increase-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--emerald);
  z-index: 1;
}

.unique-code {
  font-family: var(--mono);
  font-size: 15px;
  color: var(--text-primary);
  word-break: break-all;
  line-height: 1.6;
  padding: 16px;
  background: var(--glass);
  border-radius: var(--radius-md);
  border: 1px solid var(--card-border);
  position: relative;
  min-height: 54px;
  display: flex;
  align-items: center;
}

.unique-code span {
  opacity: 0;
  animation: charIn 0.05s forwards;
}

@keyframes charIn {
  to { opacity: 1; }
}

.unique-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.action-btn {
  flex: 1;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  background: var(--glass);
  border: 1px solid var(--card-border);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}

.action-btn:hover {
  background: var(--card);
  border-color: var(--info);
  color: var(--text-primary);
}

.action-btn svg {
  width: 16px;
  height: 16px;
}

.note-banner {
  display: flex;
  gap: 12px;
  padding: 16px;
  background: rgba(245,158,11,0.08);
  border: 1px solid rgba(245,158,11,0.2);
  border-left: 3px solid var(--amber);
  border-radius: var(--radius-md);
  animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) 0.4s both;
}

.note-banner svg {
  width: 20px;
  height: 20px;
  color: var(--amber);
  flex-shrink: 0;
  margin-top: 2px;
}

.note-text {
  font-size: 15px;
  line-height: 1.5;
  color: var(--text-secondary);
}

.note-text strong {
  color: var(--text-primary);
  font-weight: 700;
}

.notification-reminder {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: var(--glass);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-md);
  animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) 0.5s both;
}

.notification-reminder svg {
  width: 20px;
  height: 20px;
  color: var(--info);
  flex-shrink: 0;
  animation: bounce 2s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.notification-text {
  font-size: 15px;
  color: var(--text-secondary);
}

.done-btn {
  width: 100%;
  padding: 16px 24px;
  background: linear-gradient(135deg, var(--info), #2563EB);
  border: none;
  border-radius: var(--radius-md);
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) 0.6s both;
  box-shadow: 0 10px 30px -10px rgba(59,130,246,0.5);
}

.done-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 40px -10px rgba(59,130,246,0.6);
}

.done-btn:active {
  transform: translateY(0);
}

.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  transform: scale(0);
  animation: ripple 0.6s ease-out;
}

@keyframes ripple {
  to {
    transform: scale(4);
    opacity: 0;
  }
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  padding: 14px 24px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(28px);
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 1000;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.toast svg {
  width: 18px;
  height: 18px;
  color: var(--emerald);
}

@media (max-width: 640px) {
  .card {
    padding: 32px 24px;
  }
  
  .code {
    font-size: 40px;
  }
  
  .status-title {
    font-size: 24px;
  }
  
  .info-icon {
    width: 48px;
    height: 48px;
  }
}
</style>
</head>
<body>
<div class="container">
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="card" role="region" aria-live="polite" aria-label="Pending transaction status">
    <div class="progress-bar" aria-label="Processing progress"></div>
    
    <div class="status-header">
      <div class="info-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </div>
      <div class="status-text">
        <h1 class="status-title">
          <span class="pulse-dot" aria-hidden="true"></span>
          Pending<span class="ellipsis"></span>
        </h1>
      </div>
    </div>

    <div class="section">
      <div class="label">Code</div>
      <div class="code-wrapper">
        <div class="code" id="mainCode">123456</div>
        <button class="copy-btn" id="copyCode" aria-label="Copy code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="increase-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
      <span class="increase-text"><span id="counter">0</span>% Possible Increase</span>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="label">Unique code</div>
      <div class="unique-code" id="uniqueCode" data-code="8d969eef6ecad3c2"></div>
      <div class="unique-actions">
        <button class="action-btn" id="copyUnique">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copy
        </button>
        <button class="action-btn" id="toggleUnique">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <span id="toggleText">Hide</span>
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="note-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <div class="note-text">
        <strong>1%</strong> of your approved coins will be deducted for this operation
      </div>
    </div>

    <div class="notification-reminder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <div class="notification-text">Check back on the Notification for more info</div>
    </div>

    <div class="divider"></div>

    <button class="done-btn" id="doneBtn" onclick="window.location.href='home.html'">Done</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  <span id="toastText">Code copied</span>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const progressBar = document.querySelector('.progress-bar');
  const counter = document.getElementById('counter');
  const increaseBadge = document.querySelector('.increase-badge');
  const uniqueCode = document.getElementById('uniqueCode');
  const copyCode = document.getElementById('copyCode');
  const copyUnique = document.getElementById('copyUnique');
  const toggleUnique = document.getElementById('toggleUnique');
  const toggleText = document.getElementById('toggleText');
  const eyeIcon = document.getElementById('eyeIcon');
  const doneBtn = document.getElementById('doneBtn');
  const themeToggle = document.getElementById('themeToggle');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  
  let isHidden = false;
  const uniqueCodeValue = uniqueCode.dataset.code;

  // Animate progress bar
  setTimeout(() => {
    progressBar.style.setProperty('--progress', '65%');
  }, 300);

  // Animate counter 0 → 25%
  let current = 0;
  const target = 25;
  const increment = target / 50;
  const timer = setInterval(() => {
    current += increment;
    if (current >= target) {
      current = target;
      clearInterval(timer);
    }
    counter.textContent = Math.floor(current);
    increaseBadge.style.setProperty('--progress', `${(current/target) * 100}%`);
  }, 30);

  // Character fade-in for unique code
  function renderUniqueCode(hidden = false) {
    uniqueCode.innerHTML = '';
    const text = hidden ? '•'.repeat(uniqueCodeValue.length) : uniqueCodeValue;
    [...text].forEach((char, i) => {
      const span = document.createElement('span');
      span.textContent = char;
      span.style.animationDelay = `${i * 0.02}s`;
      uniqueCode.appendChild(span);
    });
  }
  renderUniqueCode(false);

  // Copy functions
  async function copyToClipboard(text, message) {
    try {
      await navigator.clipboard.writeText(text);
      showToast(message);
    } catch (err) {
      showToast('Failed to copy');
    }
  }

  function showToast(message) {
    toastText.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  copyCode.addEventListener('click', () => {
    copyToClipboard('123456', 'Code copied');
  });

  copyUnique.addEventListener('click', () => {
    copyToClipboard(uniqueCodeValue, 'Unique code copied');
  });

  // Toggle unique code visibility
  toggleUnique.addEventListener('click', () => {
    isHidden = !isHidden;
    renderUniqueCode(isHidden);
    toggleText.textContent = isHidden ? 'Show' : 'Hide';
    eyeIcon.innerHTML = isHidden 
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  // Done button ripple effect
  doneBtn.addEventListener('click', (e) => {
    const rect = doneBtn.getBoundingClientRect();
    const ripple = document.createElement('span');
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;
    
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.classList.add('ripple');
    
    doneBtn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
    showToast('Returning to dashboard');
  });

  // Theme toggle
  const currentTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  
  themeToggle.addEventListener('click', () => {
    const theme = document.documentElement.getAttribute('data-theme');
    const newTheme = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    
    const icon = newTheme === 'dark' 
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
      : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    themeToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>`;
  });

  // Update theme icon on load
  if (currentTheme === 'light') {
    themeToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
  }
});
</script>
