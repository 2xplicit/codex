<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex - Open Trade Coins</title>
<style>
    :root {
        --primary: #2563EB;
        --primary-light: #3B82F6;
        --primary-glow: rgba(37, 99, 235, 0.4);
        --success: #10B981;
        --danger: #EF4444;
        --bg: #F1F5F9;
        --bg-gradient-1: #EFF6FF;
        --bg-gradient-2: #DBEAFE;
        --bg-gradient-3: #BFDBFE;
        --card-bg: rgba(255, 255, 255, 0.65);
        --card-border: rgba(255, 255, 255, 0.5);
        --text-primary: #0F172A;
        --text-secondary: #64748B;
        --text-muted: #94A3B8;
        --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
        --shadow-lg: 0 20px 25px -5px rgba(37, 99, 235, 0.15), 0 10px 10px -5px rgba(37, 99, 235, 0.08);
        --radius-xl: 20px;
        --radius-2xl: 24px;
        --radius-3xl: 28px;
    }

    [data-theme="dark"] {
        --bg: #0F172A;
        --bg-gradient-1: #0F172A;
        --bg-gradient-2: #1E293B;
        --bg-gradient-3: #0F172A;
        --card-bg: rgba(30, 41, 59, 0.6);
        --card-border: rgba(255, 255, 255, 0.08);
        --text-primary: #F8FAFC;
        --text-secondary: #CBD5E1;
        --text-muted: #64748B;
        --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
        transition: background 0.3s ease, color 0.3s ease;
    }

    .bg-gradient {
        background: linear-gradient(145deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
        min-height: 100vh;
    }

    .glass {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--card-border);
        box-shadow: var(--shadow-md);
    }

    .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--card-border);
        box-shadow: var(--shadow-sm);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: var(--radius-3xl);
    }

    .glass-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
    }

    .glass-card:active {
        transform: scale(0.98) translateY(-2px);
    }

    .container {
        max-width: 640px;
        margin: 0 auto;
        padding-bottom: 96px;
    }

    /* Header */
    .header {
        position: sticky;
        top: 0;
        z-index: 50;
        padding: 12px 16px;
        margin-bottom: 16px;
    }

    .header-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
    }

    .icon-btn {
        padding: 8px;
        border-radius: 14px;
        border: none;
        background: transparent;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .icon-btn:hover {
        background: rgba(37, 99, 235, 0.1);
    }

    .icon-btn:active {
        transform: scale(0.9);
    }

    .icon-btn svg {
        width: 20px;
        height: 20px;
        color: var(--text-secondary);
    }

    .wallet-info {
        flex: 1;
        min-width: 0;
    }

    .wallet-label {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 2px;
    }

    .wallet-email {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
    }

    .wallet-email svg {
        width: 16px;
        height: 16px;
        color: var(--text-secondary);
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .avatar {
        width: 36px;
        height: 36px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 13px;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5);
        flex-shrink: 0;
        overflow: hidden;
    }

    .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* Title & Controls */
    .content-header {
        padding: 0 16px 16px;
    }

    .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
    }

    .page-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    /* Search */
    .search-wrapper {
        margin-bottom: 16px;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
    }

    .search-wrapper.open {
        max-height: 60px;
    }

    .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: 18px;
    }

    .search-box svg {
        width: 20px;
        height: 20px;
        color: var(--text-muted);
        flex-shrink: 0;
    }

    .search-input {
        flex: 1;
        border: none;
        background: transparent;
        outline: none;
        font-size: 15px;
        color: var(--text-primary);
    }

    .search-input::placeholder {
        color: var(--text-muted);
    }

    /* Filters */
    .filters {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
        display: none;
    }

    .filter-chip {
        padding: 9px 18px;
        border-radius: 999px;
        border: none;
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--card-border);
        color: var(--text-secondary);
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
    }

    .filter-chip:hover {
        transform: translateY(-1px);
    }

    .filter-chip.active {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        color: white;
        border-color: transparent;
    }

    .filter-chip svg {
        width: 14px;
        height: 14px;
    }

    /* Trade List */
    .trade-list {
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .trade-card {
        padding: 20px;
        cursor: pointer;
    }

    .trade-main {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
    }

    .trade-left {
        flex: 1;
        min-width: 0;
    }

    .email-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
    }

    .verified-badge {
        width: 16px;
        height: 16px;
        color: var(--primary);
        flex-shrink: 0;
    }

    .email-text {
        font-size: 12px;
        color: var(--text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .coin-amount {
        font-size: 32px;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 4px;
        letter-spacing: -1px;
    }

    .coin-name {
        font-size: 14px;
        color: var(--text-muted);
    }

    .trade-right {
        text-align: right;
    }

    .usd-value {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }

    .change-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
    }

    .change-badge.positive {
        background: rgba(16, 185, 129, 0.1);
        color: var(--success);
    }

    .change-badge.negative {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
    }

    .action-btn {
        padding: 10px 20px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
    }

    .action-btn:hover {
        box-shadow: 0 8px 16px -4px var(--primary-glow);
        transform: translateY(-1px);
    }

    .action-btn:active {
        transform: scale(0.95);
    }

    .action-btn svg {
        width: 16px;
        height: 16px;
    }

    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        transform: scale(0);
        animation: ripple-animation 0.6s ease-out;
        pointer-events: none;
    }

    @keyframes ripple-animation {
        to {
            transform: scale(4);
            opacity: 0;
        }
    }

    /* Expandable */
    .trade-expand {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .trade-expand.open {
        max-height: 300px;
    }

    .expand-content {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--card-border);
    }

    .chart-label {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .sparkline {
        width: 100%;
        height: 60px;
        margin-bottom: 16px;
    }

    .sparkline-path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw-line 1.2s ease-out forwards;
    }

    @keyframes draw-line {
        to { stroke-dashoffset: 0; }
    }

    .expand-actions {
        display: flex;
        gap: 8px;
    }

    .btn-primary {
        flex: 1;
        padding: 12px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-primary:active {
        transform: scale(0.95);
    }

    .btn-secondary {
        flex: 1;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid var(--card-border);
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    /* Bottom Nav */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 50;
        padding: 12px 0 24px;
    }

    .nav-content {
        max-width: 640px;
        margin: 0 auto;
        padding: 10px 24px;
        border-radius: 24px;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }

    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 16px;
        border-radius: 16px;
        border: none;
        background: transparent;
        cursor: pointer;
        transition: all 0.2s ease;
        color: var(--text-muted);
    }

    .nav-item.active {
        background: rgba(37, 99, 235, 0.1);
        color: var(--primary);
    }

    .nav-item svg {
        width: 24px;
        height: 24px;
    }

    .nav-item span {
        font-size: 11px;
        font-weight: 500;
    }

    /* Empty State */
    .empty-state {
        display: none;
        padding: 64px 16px;
        text-align: center;
    }

    .empty-state.show {
        display: block;
    }

    .empty-card {
        padding: 48px 24px;
        border-radius: var(--radius-3xl);
    }

    .empty-icon {
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
        color: var(--text-muted);
        opacity: 0.3;
    }

    .empty-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .empty-text {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 24px;
    }

    /* Skeleton */
    .skeleton-wrapper {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .skeleton {
        background: linear-gradient(90deg, var(--card-bg) 25%, rgba(255,255,255,0.5) 50%, var(--card-bg) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 12px;
    }

    [data-theme="dark"] .skeleton {
        background: linear-gradient(90deg, var(--card-bg) 25%, rgba(255,255,255,0.05) 50%, var(--card-bg) 75%);
        background-size: 200% 100%;
    }

    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    /* Pull to Refresh */
    .pull-indicator {
        display: flex;
        justify-content: center;
        padding-top: 16px;
        margin-top: -48px;
        opacity: 0;
        transition: all 0.2s ease;
        pointer-events: none;
    }

    .pull-spinner {
        padding: 12px;
        border-radius: 50%;
    }

    .pull-spinner svg {
        width: 24px;
        height: 24px;
        color: var(--primary);
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        align-items: flex-start;
        justify-content: center;
        padding: 80px 16px 0;
    }

    .modal.show {
        display: flex;
    }

    .modal-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
    }

    .modal-content {
        position: relative;
        width: 100%;
        max-width: 400px;
        padding: 24px;
        border-radius: var(--radius-3xl);
        animation: modal-in 0.3s ease;
    }

    @keyframes modal-in {
        from {
            opacity: 0;
            transform: scale(0.95) translateY(-20px);
        }
        to {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }

    .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
    }

    .modal-title {
        font-size: 18px;
        font-weight: 600;
    }

    .wallet-option {
        width: 100%;
        text-align: left;
        padding: 16px;
        border-radius: 16px;
        border: 2px solid transparent;
        background: rgba(37, 99, 235, 0.05);
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .wallet-option.active {
        border-color: var(--primary);
        background: rgba(37, 99, 235, 0.1);
    }

    .wallet-option-name {
        font-weight: 500;
        margin-bottom: 2px;
    }

    .wallet-option-email {
        font-size: 13px;
        color: var(--text-muted);
    }

    @media (max-width: 640px) {
        .coin-amount { font-size: 28px; }
        .usd-value { font-size: 22px; }
    }
</style>
</head>
<body>
<div class="bg-gradient">
    <div class="container">
        <!-- Pull to Refresh -->
        <div id="pullIndicator" class="pull-indicator">
            <div class="pull-spinner glass">
                <svg fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 0 1 4 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>

        <!-- Header -->
        <header class="header glass">
            <div class="header-content">
                <div class="header-left">
                    <button id="searchBtn" class="icon-btn" aria-label="Search">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"></path>
                        </svg>
                    </button>
                    <div class="wallet-info">
                        <div class="wallet-label">Main wallet</div>
                        <div id="walletBtn" class="wallet-email">
                            <span id="walletEmail">Georgedawson@gmail.com</span>
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">
                        <svg id="sunIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"></path>
                        </svg>
                        <svg id="moonIcon" style="display:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 0 1 8.646 3.646 9.003 9.003 0 0 0 12 21a9.003 9.003 0 0 0 8.354-5.646z"></path>
                        </svg>

                    </svg>
                    <input id="searchInput" type="text" class="search-input" placeholder="Search coins...">
                </div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <button class="filter-chip active" data-filter="all">All</button>
                <button class="filter-chip" data-filter="sell">Sell</button>
                <button class="filter-chip" data-filter="swap">Swap</button>
                <button class="filter-chip" data-sort="price">
                    Price
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                    </svg>
                </button>
                <button class="filter-chip" data-sort="change">24h Change</button>
            </div>
        </div>

        <!-- Trade List -->
        <div id="tradeList" class="trade-list">
            <div id="skeletonLoader" class="skeleton-wrapper">
                <div class="glass-card" style="padding: 20px;">
                    <div class="skeleton" style="height: 14px; width: 180px; margin-bottom: 12px;"></div>
                    <div class="skeleton" style="height: 32px; width: 120px; margin-bottom: 8px;"></div>
                    <div class="skeleton" style="height: 14px; width: 80px;"></div>
                </div>
                <div class="glass-card" style="padding: 20px;">
                    <div class="skeleton" style="height: 14px; width: 180px; margin-bottom: 12px;"></div>
                    <div class="skeleton" style="height: 32px; width: 120px; margin-bottom: 8px;"></div>
                    <div class="skeleton" style="height: 14px; width: 80px;"></div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <div class="empty-card glass">
                <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7m16 0v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5m16 0h-2.586a1 1 0 0 0-.707.293l-2.414 2.414a1 1 0 0 1-.707.293h-3.172a1 1 0 0 1-.707-.293l-2.414 2.414a1 1 0 0 0-.707-.293H4"></path>
                </svg>
                <h3 class="empty-title">No open trades</h3>
                <p class="empty-text">Start trading to see your open positions here</p>
                <button class="btn-primary" style="max-width: 200px;">Create Trade</button>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
    <div class="nav-content glass">
        <button class="nav-item active" data-nav="home" onclick="window.location.href='home.html'">
            <svg fill="currentColor" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
            </svg>
            <span>Home</span>
        </button>
        <button class="nav-item" data-nav="search" onclick="window.location.href='search.html'">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"></path>
            </svg>
            <span>Search</span>
        </button>
        <button class="nav-item" data-nav="community">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 0 0-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 0 1 5.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 0 1 9.288 0M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm6 3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"></path>
            </svg>
            <span>Community</span>
        </button>
        <button class="nav-item" data-nav="profile" onclick="window.location.href='profile.html'">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM12 14a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7z"></path>
            </svg>
            <span>Profile</span>
        </button>
    </div>
</nav>

<!-- Wallet Modal -->
<div id="walletModal" class="modal">
    <div id="modalOverlay" class="modal-overlay"></div>
    <div class="modal-content glass">
        <div class="modal-header">
            <h3 class="modal-title">Switch Wallet</h3>
            <button id="closeModal" class="icon-btn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <button class="wallet-option active" data-wallet="Georgedawson@gmail.com">
            <div class="wallet-option-name">Main Wallet</div>
            <div class="wallet-option-email">Georgedawson@gmail.com</div>
        </button>
        <button class="wallet-option" data-wallet="business@codex.com">
            <div class="wallet-option-name">Business Wallet</div>
            <div class="wallet-option-email">business@codex.com</div>
        </button>
    </div>
</div>

<script>
    // Data
    const trades = [
        { id: 1, email: 'Georgedawson@gmail.com', coin: 'Astron', amount: 8500, value: 1000, change: 0.12, type: 'sell' },
        { id: 2, email: 'Georgedawson@gmail.com', coin: 'Bitro', amount: 4200, value: 5.00, change: -0.12, type: 'swap' },
        { id: 3, email: 'Georgedawson@gmail.com', coin: 'Citro', amount: 15625, value: 1800, change: 0.12, type: 'swap' },
        { id: 4, email: 'Georgedawson@gmail.com', coin: 'Detro', amount: 83247, value: 9900.64, change: 0.12, type: 'sell' },
        { id: 5, email: 'Georgedawson@gmail.com', coin: 'Ethron', amount: 132870, value: 15900.40, change: -0.12, type: 'swap' },
        { id: 6, email: 'Georgedawson@gmail.com', coin: 'Fitron', amount: 1470, value: 176.40, change: -0.12, type: 'sell' }
    ];

    let currentFilter = 'all';
    let currentSort = null;
    let searchQuery = '';
    let expandedCard = null;
    let currentWallet = 'Georgedawson@gmail.com';

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        initTheme();
        initAvatar();
        setTimeout(() => {
            document.getElementById('skeletonLoader').style.display = 'none';
            renderTrades();
        }, 1000);
        initEventListeners();
        initPullToRefresh();
    });

    // Theme
    function initTheme() {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        updateThemeIcon(theme);
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const newTheme = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        document.getElementById('sunIcon').style.display = theme === 'dark' ? 'none' : 'block';
        document.getElementById('moonIcon').style.display = theme === 'dark' ? 'block' : 'none';
    }

    function initAvatar() {
        const img = document.getElementById('avatarImg');
        const fallback = document.getElementById('avatarFallback');
        img.onload = () => {
            img.hidden = false;
            fallback.style.display = 'none';
        };
        img.onerror = () => {
            img.hidden = true;
            fallback.style.display = 'block';
        };
        // Trigger load if already cached
        if (img.complete) {
            img.onload();
        }
    }

    // Events
    function initEventListeners() {
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.getElementById('searchBtn').addEventListener('click', toggleSearch);
        document.getElementById('searchInput').addEventListener('input', handleSearch);
        document.getElementById('walletBtn').addEventListener('click', showWalletModal);
        document.getElementById('closeModal').addEventListener('click', hideWalletModal);
        document.getElementById('modalOverlay').addEventListener('click', hideWalletModal);

        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', handleFilter);
        });

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', handleNav);
        });

        document.querySelectorAll('.wallet-option').forEach(opt => {
            opt.addEventListener('click', (e) => {
                currentWallet = e.currentTarget.dataset.wallet;
                document.getElementById('walletEmail').textContent = currentWallet;
                document.querySelectorAll('.wallet-option').forEach(o => o.classList.remove('active'));
                e.currentTarget.classList.add('active');
                hideWalletModal();
                renderTrades();
            });
        });
    }

    function toggleSearch() {
        const wrapper = document.getElementById('searchWrapper');
        wrapper.classList.toggle('open');
        if (wrapper.classList.contains('open')) {
            document.getElementById('searchInput').focus();
        }
    }

    function handleSearch(e) {
        searchQuery = e.target.value.toLowerCase();
        renderTrades();
    }

    function handleFilter(e) {
        const chip = e.currentTarget;
        const filter = chip.dataset.filter;
        const sort = chip.dataset.sort;

        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');

        if (filter) {
            currentFilter = filter;
            currentSort = null;
        } else if (sort) {
            currentSort = currentSort === sort ? null : sort;
            currentFilter = 'all';
        }

        renderTrades();
    }

    function handleNav(e) {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        e.currentTarget.classList.add('active');
    }

    function showWalletModal() {
        document.getElementById('walletModal').classList.add('show');
    }

    function hideWalletModal() {
        document.getElementById('walletModal').classList.remove('show');
    }

    // Render
    function renderTrades() {
        let filtered = trades.filter(trade => {
            const matchesWallet = trade.email === currentWallet;
            const matchesFilter = currentFilter === 'all' || trade.type === currentFilter;
            const matchesSearch = !searchQuery || trade.coin.toLowerCase().includes(searchQuery);
            return matchesWallet && matchesFilter && matchesSearch;
        });

        if (currentSort === 'price') {
            filtered.sort((a, b) => b.value - a.value);
        } else if (currentSort === 'change') {
            filtered.sort((a, b) => b.change - a.change);
        }

        const list = document.getElementById('tradeList');
        const empty = document.getElementById('emptyState');

        if (filtered.length === 0) {
            list.innerHTML = '';
            empty.classList.add('show');
            return;
        }

        empty.classList.remove('show');
        list.innerHTML = filtered.map(createCard).join('');
        
        filtered.forEach(trade => {
            const card = document.getElementById(`card-${trade.id}`);
            const actionBtn = document.getElementById(`action-${trade.id}`);
            if (card) card.addEventListener('click', () => toggleExpand(trade.id));
            if (actionBtn) {
                actionBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    createRipple(e);
                });
            }
        });
    }

    function createCard(trade) {
        const isPositive = trade.change >= 0;
        const actionIcon = trade.type === 'sell' ? 
            'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6' :
            'M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4';

        return `
            <div id="card-${trade.id}" class="glass-card trade-card">
                <div class="trade-main">
                    <div class="trade-left">
                        <div class="email-badge">
                            <svg class="verified-badge" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 0 0 1.745-.723 3.066 3.066 0 0 1 3.976 0 3.066 3.066 0 0 0 1.745.723 3.066 0 0 1 2.812 2.812c.051.643.304 1.254.723 1.745a3.066 0 0 1 0 3.976 3.066 0 0 0-.723 1.745 3.066 0 0 1-2.812 2.812 3.066 3.066 0 0 0-1.745.723 3.066 3.066 0 0 1-3.976 0 3.066 3.066 0 0 0-1.745-.723 3.066 3.066 0 0 1-2.812-2.812 3.066 3.066 0 0 0-.723-1.745 3.066 3.066 0 0 1 0-3.976 3.066 3.066 0 0 0 .723-1.745 3.066 3.066 0 0 1 2.812-2.812zm7.44 5.252a1 1 0 0 0-1.414-1.414L9 10.586 7.707 9.293a1 1 0 0 0-1.414 1.414l2 2a1 1 0 0 0 1.414 0l4-4z" clip-rule="evenodd"></path>
                            </svg>
                            <span class="email-text">${trade.email}</span>
                        </div>
                        <div class="coin-amount">${trade.amount.toLocaleString()}</div>
                        <div class="coin-name">${trade.coin}</div>
                    </div>
                    <div class="trade-right">
                        <div class="usd-value">$${trade.value.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                        <div class="change-badge ${isPositive ? 'positive' : 'negative'}">
                            ${isPositive ? '↑' : '↓'} ${isPositive ? '+' : ''}${trade.change.toFixed(2)}$
                        </div>
                        <button id="action-${trade.id}" class="action-btn">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${actionIcon}"></path>
                            </svg>
                            ${trade.type.charAt(0).toUpperCase() + trade.type.slice(1)}
                        </button>
                    </div>
                </div>
                <div id="expand-${trade.id}" class="trade-expand">
                    <div class="expand-content">
                        <div class="chart-label">24h Price Chart</div>
                        <svg class="sparkline" viewBox="0 0 200 50">
                            <polyline class="sparkline-path" fill="none" stroke="${isPositive ? '#10B981' : '#EF4444'}" stroke-width="2.5" points="0,30 30,25 60,35 90,20 120,28 150,15 180,22 200,18"></polyline>
                        </svg>
                        <div class="expand-actions">
                            <button class="btn-primary">Quick Trade</button>
                            <button class="btn-secondary">View Details</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function toggleExpand(id) {
        const content = document.getElementById(`expand-${id}`);
        if (expandedCard === id) {
            content.classList.remove('open');
            expandedCard = null;
        } else {
            if (expandedCard) {
                document.getElementById(`expand-${expandedCard}`).classList.remove('open');
            }
            content.classList.add('open');
            expandedCard = id;
        }
    }

    function createRipple(e) {
        const button = e.currentTarget;
        const ripple = document.createElement('span');
        const rect = button.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;
        
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.classList.add('ripple');
        
        button.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }

    // Pull to Refresh
    function initPullToRefresh() {
        let startY = 0;
        let pulling = false;
        const indicator = document.getElementById('pullIndicator');

        document.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) {
                startY = e.touches[0].clientY;
                pulling = true;
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!pulling) return;
            const diff = e.touches[0].clientY - startY;
            if (diff > 0 && diff < 100) {
                indicator.style.opacity = diff / 100;
                indicator.style.transform = `translateY(${diff / 2}px)`;
            }
        }, { passive: true });

        document.addEventListener('touchend', () => {
            if (!pulling) return;
            pulling = false;
            indicator.style.opacity = '0';
            indicator.style.transform = 'translateY(0)';
            document.getElementById('skeletonLoader').style.display = 'block';
            setTimeout(() => {
                document.getElementById('skeletonLoader').style.display = 'none';
                renderTrades();
            }, 800);
        });
    }
</script>

</body>
