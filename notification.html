<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Premium UI 2026</title>
<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  
  :root {
    --bg: #020617;
    --surface: #0F172A;
    --surface-glass: rgba(255,255,255,0.03);
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
    --border: rgba(255,255,255,0.08);
    --success: #10B981;
    --info: #3B82F6;
    --swap: #8B5CF6;
    --warning: #F59E0B;
    --delete: #EF4444;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 32px;
  }

  [data-theme="light"] {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --surface-glass: rgba(255,255,255,0.6);
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #64748B;
    --border: rgba(0,0,0,0.08);
  }

  * {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    background: var(--bg);
    color: var(--text-primary);
    transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 100vh;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .glassmorphism {
    background: var(--surface-glass);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1px solid var(--border);
  }

  .glass-header {
    background: var(--surface-glass);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 40;
  }

  .container {
    max-width: 896px;
    margin: 0 auto;
    padding: 0 16px;
    position: relative;
    z-index: 1;
  }

  @media (min-width: 640px) {
    .container {
      padding: 0 24px;
    }
  }

  .header-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-btn {
    padding: 8px;
    border-radius: var(--radius-md);
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-primary);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn:hover {
    background: var(--surface);
    transform: scale(1.1);
  }

  .icon-btn:active {
    transform: scale(0.95);
  }

  .btn-primary {
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    background: var(--info);
    color: white;
    border: none;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .btn-primary:hover {
    opacity: 0.9;
    transform: scale(1.05);
  }

  .btn-primary:active {
    transform: scale(0.95);
  }

  .btn-warning {
    background: var(--warning);
  }

  .btn-delete {
    background: var(--delete);
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
  }

  .header-subtitle {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .theme-toggle {
    position: relative;
  }

  .theme-toggle svg {
    width: 20px;
    height: 20px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: absolute;
  }

  [data-theme="light"] .sun-icon { opacity: 1; transform: rotate(0deg) scale(1); }
  [data-theme="light"] .moon-icon { opacity: 0; transform: rotate(180deg) scale(0); }
  [data-theme="dark"] .sun-icon { opacity: 0; transform: rotate(180deg) scale(0); }
  [data-theme="dark"] .moon-icon, :root .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }

  .tabs-wrapper {
    padding-bottom: 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tabs-wrapper::-webkit-scrollbar {
    display: none;
  }

  .filter-tabs {
    display: flex;
    gap: 8px;
  }

  .filter-tab {
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    background: transparent;
    color: var(--text-primary);
    border: none;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
  }

  .filter-tab:hover {
    background: var(--surface);
  }

  .filter-tab.active {
    background: var(--info);
    color: white;
  }

  .filter-tab span {
    opacity: 0.6;
    margin-left: 4px;
  }

  .filter-tab.active span {
    opacity: 0.8;
  }

  main {
    padding: 24px 0;
  }

  .notifications-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .gradient-border {
    position: relative;
    background: var(--surface);
    z-index: 0;
  }

  .gradient-border::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: conic-gradient(from var(--angle), transparent, var(--info), transparent, var(--swap), transparent);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: rotate 4s linear infinite;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: -1;
  }

  .notification-card:hover.gradient-border::before,
  .notification-card[data-unread="true"].gradient-border::before {
    opacity: 1;
  }

  @keyframes rotate {
    to { --angle: 360deg; }
  }

  .notification-card {
    contain: layout style paint;
    transform: translateZ(0);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
    border-radius: var(--radius-xl);
    padding: 24px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .notification-card:hover {
    transform: translateX(8px) translateZ(0);
    box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  }

  .notification-card[data-unread="true"] {
    font-weight: 600;
  }

  .notification-card[data-unread="false"] {
    font-weight: 400;
    opacity: 0.65;
  }

  .notification-card[data-unread="false"] .icon-wrapper {
    opacity: 0.6;
  }

  .accent-bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--info);
    transform: scaleY(0);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    transform-origin: top;
    border-radius: var(--radius-xl) 0 0 var(--radius-xl);
  }

  .notification-card[data-unread="true"] .accent-bar {
    transform: scaleY(1);
  }

  .card-content {
    display: flex;
    gap: 16px;
    position: relative;
  }

  .checkbox-wrapper {
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
  }

  .bulk-mode .checkbox-wrapper {
    max-width: 40px;
    opacity: 1;
  }

  .checkbox-wrapper input {
    width: 20px;
    height: 20px;
    border-radius: 8px;
    cursor: pointer;
  }

  .icon-wrapper {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }

  .notification-card:hover .icon-wrapper {
    transform: scale(1.1) rotate(5deg);
  }

  .icon-wrapper svg {
    width: 20px;
    height: 20px;
  }

  .card-body {
    flex: 1;
    min-width: 0;
  }

  .card-header {
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }

  .card-title {
    font-size: 18px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .unread-dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--info);
    animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
    50% { opacity: 0.8; box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
  }

  .card-message {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .card-time {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  .swipe-actions {
    position: absolute;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 600;
    color: white;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .swipe-actions.left {
    right: 0;
    background: linear-gradient(90deg, transparent, var(--delete));
  }

  .swipe-actions.right {
    left: 0;
    background: linear-gradient(90deg, var(--info), transparent);
  }

  .expanded-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .notification-card.expanded .expanded-content {
    max-height: 200px;
    opacity: 1;
    margin-top: 16px;
  }

  .expanded-inner {
    padding-top: 16px;
    margin-top: 16px;
    border-top: 1px solid var(--border);
  }

  .expanded-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    margin-top: 8px;
  }

  .expanded-row:first-child {
    margin-top: 0;
  }

  .expanded-row span:first-child {
    color: var(--text-secondary);
  }

  .expanded-row span:last-child {
    font-family: monospace;
    font-weight: 600;
  }

  .view-details {
    margin-top: 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--info);
    background: none;
    border: none;
    cursor: pointer;
  }

  .view-details:hover {
    text-decoration: underline;
  }

  .pull-to-refresh {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
  }

  .pull-to-refresh.show {
    opacity: 1;
    transform: translateX(-50%) translateY(80px);
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--info);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .bottom-bar {
    transform: translateY(120%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 40;
    border-top: 1px solid var(--border);
  }

  .bottom-bar.show {
    transform: translateY(0);
  }

  .bottom-bar-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
  }

  .bottom-bar-content p {
    font-size: 14px;
    font-weight: 600;
  }

  .bottom-bar-actions {
    display: flex;
    gap: 8px;
  }

  .empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 0;
    text-align: center;
  }

  .empty-state.show {
    display: flex;
  }

  .empty-state svg {
    width: 128px;
    height: 128px;
    margin-bottom: 24px;
    opacity: 0.5;
  }

  .empty-state h2 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .empty-state p {
    color: var(--text-secondary);
  }

  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    background: var(--info);
    animation: confetti-fall 3s linear forwards;
    border-radius: 50%;
  }

  @keyframes confetti-fall {
    to {
      transform: translateY(100vh) rotate(720deg);
      opacity: 0;
    }
  }

  .new-notification {
    animation: slide-down 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes slide-down {
    from {
      opacity: 0;
      transform: translateY(-20px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border-width: 0;
  }

  #confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }

  @media (max-width: 640px) {
    .notification-card:hover {
      transform: translateX(0) translateZ(0);
    }
  }
</style>
</head>

    { id: 3, type: 'code', title: 'Code approval', message: 'Your code has been approved', time: '1m ago', timestamp: Date.now() - 60000, unread: true, icon: 'clipboard-check', color: 'success', txID: 'TXN-9B5E3C74' },
    { id: 4, type: 'swap', title: 'Coin swap', message: 'You successfully swapped Astro coins', time: '1m ago', timestamp: Date.now() - 60000, unread: true, icon: 'arrows-left-right', color: 'swap', txID: 'TXN-6D2F4A63' },

  let notificationsData = [...notifications];
  let currentFilter = 'all';
  let bulkMode = false;
  let selectedIds = new Set();
  let longPressTimer = null;

  const icons = {
    'clipboard-check': '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>',

  const listEl = document.getElementById('notifications-list');
  const emptyStateEl = document.getElementById('empty-state');

  function initTheme() {
    const saved = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  }

  function getFilteredNotifications() {
    if (currentFilter === 'all') return notificationsData;
    if (currentFilter === 'unread') return notificationsData.filter(n => n.unread);
    return notificationsData.filter(n => n.type === currentFilter);
  }

  function updateUnreadCount() {
    const unread = notificationsData.filter(n => n.unread).length;
    document.getElementById('unread-count').textContent = unread;
    document.getElementById('unread-tab-count').textContent = unread;
    
    document.querySelector('[data-filter="all"] span').textContent = notificationsData.length;
    document.getElementById('code-count').textContent = notificationsData.filter(n => n.type === 'code').length;
    document.getElementById('coin-count').textContent = notificationsData.filter(n => n.type === 'coin').length;
    document.getElementById('swap-count').textContent = notificationsData.filter(n => n.type === 'swap').length;
  }

  function createNotificationCard(notif) {
    const colorMap = {
      success: 'var(--success)',
      info: 'var(--info)',
      swap: 'var(--swap)'
    };

    return `
      <div class="notification-card gradient-border glassmorphism" 
           data-id="${notif.id}" 
           data-unread="${notif.unread}"
           data-type="${notif.type}"
           role="article"
           aria-label="${notif.title}: ${notif.message}"

        <div class="swipe-actions right">Mark read</div>

        <div class="card-content">
          <div class="checkbox-wrapper">
            <input type="checkbox" data-id="${notif.id}">
          </div>
          <div class="icon-wrapper" style="background: linear-gradient(135deg, ${colorMap[notif.color]}, ${colorMap[notif.color]}aa);">
            ${icons[notif.icon]}
          </div>
          <div class="card-body">
            <div class="card-header">
              <h3 class="card-title">${notif.title}</h3>
              ${notif.unread ? '<div class="unread-dot"></div>' : ''}
            </div>
            <p class="card-message">${notif.message}</p>
            <p class="card-time">${notif.time}</p>
            <div class="expanded-content">
              <div class="expanded-inner">
                <div class="expanded-row">
                  <span>Transaction ID</span>
                  <span>${notif.txID}</span>
                </div>
                <div class="expanded-row">
                  <span>Full date</span>
                  <span>${new Date(notif.timestamp).toLocaleString()}</span>
                </div>
                <button onclick="window.location.href='approval.html'" class="view-details">View details →</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderNotifications() {
    const filtered = getFilteredNotifications();
    
    if (filtered.length === 0) {
      listEl.innerHTML = '';
      emptyStateEl.classList.add('show');
      if (currentFilter === 'all' && notificationsData.length === 0) {
        triggerConfetti();
      }
      return;
    }
    
    emptyStateEl.classList.remove('show');
    listEl.innerHTML = filtered.map(createNotificationCard).join('');
    attachCardListeners();
  }

  function attachCardListeners() {
    document.querySelectorAll('.notification-card').forEach(card => {
      let startX = 0, currentX = 0, isDragging = false;
      
      card.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        isDragging = true;
        longPressTimer = setTimeout(() => {
          if (!bulkMode) enableBulkMode();
          const checkbox = card.querySelector('input[type="checkbox"]');
          if (checkbox) {
            checkbox.checked = true;
            handleCheckboxChange(card.dataset.id, true);
          }
        }, 500);
      });

      card.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        currentX = e.touches[0].clientX - startX;
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
        if (Math.abs(currentX) > 10) {
          card.style.transform = `translateX(${currentX}px) translateZ(0)`;
          const leftActions = card.querySelector('.swipe-actions.left');
          const rightActions = card.querySelector('.swipe-actions.right');
          if (currentX < 0) {
            leftActions.style.opacity = Math.min(Math.abs(currentX) / 100, 1);
            rightActions.style.opacity = 0;
          } else {
            rightActions.style.opacity = Math.min(currentX / 100, 1);
            leftActions.style.opacity = 0;
          }
        }
      });

      card.addEventListener('touchend', () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
        isDragging = false;
        
        if (Math.abs(currentX) > 100) {
          if (currentX < 0) {
            deleteNotification(card.dataset.id);
          } else {
            markAsRead(card.dataset.id);
          }
        }
        
        card.style.transform = '';
        card.querySelector('.swipe-actions.left').style.opacity = 0;
        card.querySelector('.swipe-actions.right').style.opacity = 0;
        currentX = 0;
      });

      card.addEventListener('click', (e) => {
        if (e.target.type === 'checkbox' || e.target.classList.contains('view-details')) return;
        if (bulkMode) {
          const checkbox = card.querySelector('input[type="checkbox"]');
          checkbox.checked = !checkbox.checked;
          handleCheckboxChange(card.dataset.id, checkbox.checked);
          return;
        }
        
        if (currentOpenCard && currentOpenCard !== card) {
          currentOpenCard.classList.remove('expanded');
        }
        card.classList.toggle('expanded');
        currentOpenCard = card.classList.contains('expanded') ? card : null;
        
        if (card.dataset.unread === 'true') {
          markAsRead(card.dataset.id);
        }
      });

      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          card.click();
        } else if (e.key === 'Delete' || e.key === 'Del') {
          deleteNotification(card.dataset.id);
        } else if (e.key === 'a' || e.key === 'A') {
          archiveNotification(card.dataset.id);
        } else if (e.key === 'r' || e.key === 'R') {
          markAsRead(card.dataset.id);
        }
      });

      const checkbox = card.querySelector('input[type="checkbox"]');
      if (checkbox) {
        checkbox.addEventListener('change', (e) => {
          e.stopPropagation();
          handleCheckboxChange(card.dataset.id, e.target.checked);
        });
      }
    });
  }

  function markAsRead(id) {
    const notif = notificationsData.find(n => n.id == id);
    if (notif && notif.unread) {
      notif.unread = false;
      const card = document.querySelector(`[data-id="${id}"]`);
      if (card) {
        card.dataset.unread = 'false';
        card.querySelector('.unread-dot')?.remove();
      }
      updateUnreadCount();
      announceToScreenReader(`${notif.title} marked as read`);
    }
  }

  function deleteNotification(id) {
    notificationsData = notificationsData.filter(n => n.id != id);
    const card = document.querySelector(`[data-id="${id}"]`);
    if (card) {
      card.style.animation = 'slide-down 0.3s reverse';
      setTimeout(() => {
        renderNotifications();
        updateUnreadCount();
      }, 300);
    }
    announceToScreenReader('Notification deleted');
  }

  function archiveNotification(id) {
    deleteNotification(id);
    announceToScreenReader('Notification archived');
  }

  function enableBulkMode() {
    bulkMode = true;
    document.body.classList.add('bulk-mode');
    document.getElementById('bottom-bar').classList.add('show');
    announceToScreenReader('Bulk selection mode enabled');
  }

  function disableBulkMode() {
    bulkMode = false;
    selectedIds.clear();
    document.body.classList.remove('bulk-mode');
    document.getElementById('bottom-bar').classList.remove('show');
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
    document.getElementById('selected-count').textContent = '0';
  }

  function handleCheckboxChange(id, checked) {
    if (checked) {
      selectedIds.add(id);
    } else {
      selectedIds.delete(id);
    }
    document.getElementById('selected-count').textContent = selectedIds.size;
    if (selectedIds.size === 0 && bulkMode) {
      disableBulkMode();
    }
  }

  function triggerConfetti() {
    const container = document.getElementById('confetti-container');
    const colors = ['var(--info)', 'var(--success)', 'var(--swap)', 'var(--warning)'];
    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        confetti.style.animationDuration = 2 + Math.random() * 2 + 's';
        container.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
      }, i * 30);
    }
  }

  function announceToScreenReader(message) {
    const announcement = document.createElement('div');
    announcement.setAttribute('role', 'status');
    announcement.setAttribute('aria-live', 'polite');
    announcement.className = 'sr-only';
    announcement.textContent = message;
    document.body.appendChild(announcement);
    setTimeout(() => announcement.remove(), 1000);
  }

  function simulateNewNotification() {
    const newNotif = {
      id: Date.now(),
      type: 'code',
      title: 'New Code approval',
      message: 'A new code has been approved',
      time: 'just now',
      timestamp: Date.now(),
      unread: true,
      icon: 'clipboard-check',
      color: 'success',
      txID: 'TXN-' + Math.random().toString(36).substr(2, 9).toUpperCase()
    };
    notificationsData.unshift(newNotif);
    renderNotifications();
    updateUnreadCount();
    document.querySelector(`[data-id="${newNotif.id}"]`)?.classList.add('new-notification');
  }

  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

  document.getElementById('mark-all-read').addEventListener('click', () => {
    notificationsData.forEach(n => n.unread = false);
    renderNotifications();
    updateUnreadCount();
    announceToScreenReader('All notifications marked as read');
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    announceToScreenReader('Going back');
  });

  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentFilter = tab.dataset.filter;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.remove('active');
      });
      tab.classList.add('active');
      renderNotifications();
      disableBulkMode();
    });
  });

  document.getElementById('bulk-delete').addEventListener('click', () => {
    selectedIds.forEach(id => deleteNotification(id));
    disableBulkMode();
  });

  document.getElementById('bulk-archive').addEventListener('click', () => {
    selectedIds.forEach(id => archiveNotification(id));
    disableBulkMode();
  });

  let startY = 0, currentY = 0, isPulling = false;
  const ptr = document.getElementById('pull-to-refresh');
  
  document.addEventListener('touchstart', (e) => {
    if (window.scrollY === 0) {
      startY = e.touches[0].clientY;
      isPulling = true;
    }
  });

  document.addEventListener('touchmove', (e) => {
    if (!isPulling) return;
    currentY = e.touches[0].clientY - startY;
    if (currentY > 0 && currentY < 150) {
      ptr.style.opacity = Math.min(currentY / 100, 1);
      ptr.style.transform = `translateX(-50%) translateY(${70 + currentY * 0.5}px)`;
    }
  });

  document.addEventListener('touchend', () => {
    if (!isPulling) return;
    isPulling = false;
    if (currentY > 80) {
      ptr.classList.add('show');
      announceToScreenReader('Refreshing notifications');
      setTimeout(() => {
        simulateNewNotification();
        ptr.classList.remove('show');
        ptr.style.opacity = '';
        ptr.style.transform = '';
      }, 1500);
    } else {
      ptr.style.opacity = '';
      ptr.style.transform = '';
    }
    currentY = 0;
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape' && bulkMode) {
      disableBulkMode();
    }
  });

  document.addEventListener('click', (e) => {
    if (bulkMode && !e.target.closest('.notification-card') && !e.target.closest('#bottom-bar')) {
      disableBulkMode();
    }
  });

  initTheme();
  renderNotifications();
  updateUnreadCount();

  const liveRegion = document.createElement('div');
  liveRegion.setAttribute('aria-live', 'polite');
  liveRegion.setAttribute('aria-atomic', 'true');
  liveRegion.className = 'sr-only';
  document.body.appendChild(liveRegion);
</script>
