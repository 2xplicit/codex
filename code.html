<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Marketplace | 2026 UI</title>
<style>
  :root {
    --primary: #2563EB;
    --primary-dark: #1D4ED8;
    --success: #10B981;
    --warning: #F59E0B;
    --neutral: #6B7280;
    
    --bg: #0B1120;
    --card: #1E293B;
    --card-hover: #273449;
    --text: #F8FAFC;
    --text-muted: #94A3B8;
    --border: rgba(255,255,255,0.08);
    --glass: rgba(255,255,255,0.05);
    --glass-strong: rgba(255,255,255,0.08);
    --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }

  [data-theme="light"] {
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --card-hover: #F8FAFC;
    --text: #0F172A;
    --text-muted: #64748B;
    --border: rgba(15,23,42,0.08);
    --glass: rgba(255,255,255,0.7);
    --glass-strong: rgba(255,255,255,0.9);
    --shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 10px 10px -5px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background 0.3s ease, color 0.3s ease;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 20% 30%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
    z-index: -1;
    animation: gradientShift 20s ease infinite;
  }

  @keyframes gradientShift {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(5%, 5%) rotate(120deg); }
    66% { transform: translate(-5%, 5%) rotate(240deg); }
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    background: var(--glass);
    border-bottom: 1px solid var(--border);
    transition: all 0.3s ease;
  }

  .header-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    gap: 20px;
  }

  .header-left, .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: var(--glass-strong);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    color: var(--text);
  }

  .icon-btn:hover {
    background: var(--card-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }

  .icon-btn:active {
    transform: translateY(0);
  }

  .notification-dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    background: #EF4444;
    border-radius: 50%;
    animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.1); }
  }

  .search-wrapper {
    flex: 1;
    max-width: 500px;
    position: relative;
  }

  .search-input {
    width: 100%;
    height: 44px;
    padding: 0 16px 0 48px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--glass-strong);
    color: var(--text);
    font-size: 15px;
    transition: all 0.2s ease;
    backdrop-filter: blur(24px);
  }

  .search-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  /* Filter Bar */
  .filter-bar {
    position: sticky;
    top: 77px;
    z-index: 90;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    background: var(--glass);
    border-bottom: 1px solid var(--border);
    padding: 16px 0;
    transition: all 0.3s ease;
  }

  .filter-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .sort-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chip {
    padding: 8px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--glass-strong);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .chip:hover {
    background: var(--card-hover);
    transform: translateY(-1px);
  }

  .chip.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .results-count {
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 32px 0 60px;
  }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (min-width: 1024px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* Code Card */
  .card {
    position: relative;
    background: var(--glass-strong);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 32px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    will-change: transform;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 28px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    background: var(--card-hover);
  }

  .card:hover::before {
    opacity: 1;
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .card-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--glass-strong);
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }

  .copy-btn {
    opacity: 0;
    transform: translateX(10px);
    transition: all 0.2s ease;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--glass-strong);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
  }

  .card:hover .copy-btn {
    opacity: 1;
    transform: translateX(0);
  }

  .copy-btn:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .code-number {
    font-family: 'SF Mono', 'Monaco', 'Cascadia Code', monospace;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, var(--text), var(--text-muted));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 16px 0 8px;
    line-height: 1.2;
  }

  .code-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .stats-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .target-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .target-badge.success {
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .target-badge.warning {
    background: rgba(245, 158, 11, 0.15);
    color: var(--warning);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .target-badge.neutral {
    background: rgba(107, 114, 128, 0.15);
    color: var(--neutral);
    border: 1px solid rgba(107, 114, 128, 0.3);
  }

  .hot-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(239, 68, 68, 0.9);
    color: white;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  .buy-btn {
    width: 100%;
    height: 48px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .buy-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
  }

  .buy-btn:active::before {
    width: 300px;
    height: 300px;
  }

  .buy-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4);
  }

  .buy-btn.loading {
    pointer-events: none;
    opacity: 0.7;
  }

  .buy-btn.success {
    background: linear-gradient(135deg, var(--success), #059669);
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Toast */
  .toast-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
  }

  .toast {
    padding: 14px 20px;
    border-radius: 12px;
    background: var(--card);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: translateY(20px);
    animation: slideUp 0.3s ease forwards;
    pointer-events: all;
  }

  @keyframes slideUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes slideDown {
    to {
      opacity: 0;
      transform: translateY(20px);
    }
  }

  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid #EF4444; }

  /* Theme Toggle */
  .theme-toggle {
    position: relative;
    width: 60px;
    height: 32px;
    background: var(--glass-strong);
    border: 1px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .theme-toggle-slider {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    background: var(--primary);
    border-radius: 50%;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }

  [data-theme="light"] .theme-toggle-slider {
    transform: translateX(28px);
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }

  .empty-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    opacity: 0.3;
  }

  /* Accessibility */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-content">
        <div class="header-left">
          <button class="icon-btn" aria-label="Back" onclick="window.location.href='home.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <div class="icon-btn" style="pointer-events: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
          </div>
        </div>
        
        <div class="search-wrapper">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search codes..." aria-label="Search codes">
        </div>

        <div class="header-right">
          <button class="icon-btn" id="filterBtn" aria-label="Filter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
          </button>
          <button class="icon-btn" aria-label="Notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-dot"></span>
          </button>
          <div class="theme-toggle" id="themeToggle" role="switch" aria-label="Toggle theme">
            <div class="theme-toggle-slider">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="filter-bar">
    <div class="container">
      <div class="filter-content">
        <div class="sort-chips">
          <button class="chip active" data-sort="high">% High</button>
          <button class="chip" data-sort="low">% Low</button>
          <button class="chip" data-sort="code">Code</button>
          <button class="chip" data-sort="new">New</button>
        </div>
        <div class="results-count" id="resultsCount">6 codes available</div>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="grid" id="codeGrid"></div>
    <div class="empty-state" id="emptyState" style="display: none;">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <h3 style="font-size: 20px; margin-bottom: 8px;">No codes found</h3>
      <p>Try adjusting your search or filters</p>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

<script>
  const codes = [
    { id: 1, number: '123456', percentage: 25, used: 2300, rating: 4.8, hot: false },
    { id: 2, number: '239936', percentage: 48, used: 5400, rating: 4.9, hot: true },
    { id: 3, number: '595626', percentage: 40, used: 3200, rating: 4.7, hot: false, trending: true },
    { id: 4, number: '007532', percentage: 38, used: 1800, rating: 4.6, hot: false },
    { id: 5, number: '411371', percentage: 33, used: 2700, rating: 4.5, hot: false },
    { id: 6, number: '830613', percentage: 4, used: 1200, rating: 4.2, hot: false }
  ];

  let filteredCodes = [...codes];
  let currentSort = 'high';
  let searchQuery = '';

  const grid = document.getElementById('codeGrid');
  const searchInput = document.getElementById('searchInput');
  const resultsCount = document.getElementById('resultsCount');
  const emptyState = document.getElementById('emptyState');
  const toastContainer = document.getElementById('toastContainer');
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');

  // Theme
  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon(savedTheme);

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateThemeIcon(next);
  });

  function updateThemeIcon(theme) {
    themeIcon.innerHTML = theme === 'dark' 
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>'
      : '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
  }

  // Render cards
  function renderCards() {
    if (filteredCodes.length === 0) {
      grid.style.display = 'none';
      emptyState.style.display = 'block';
      resultsCount.textContent = '0 codes found';
      return;
    }

    grid.style.display = 'grid';
    emptyState.style.display = 'none';
    resultsCount.textContent = `${filteredCodes.length} code${filteredCodes.length !== 1 ? 's' : ''} available`;

    grid.innerHTML = filteredCodes.map(code => {
      const badgeClass = code.percentage >= 40 ? 'success' : code.percentage >= 20 ? 'warning' : 'neutral';
      const formattedUsed = code.used >= 1000 ? `${(code.used / 1000).toFixed(1)}k` : code.used;
      
      return `
        <div class="card" data-id="${code.id}">
          ${code.hot ? '<div class="hot-badge">HOT</div>' : ''}
          ${code.trending ? '<div class="hot-badge" style="background: rgba(139, 92, 246, 0.9);">TRENDING</div>' : ''}
          <div class="card-header">
            <div class="card-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
              Code
            </div>
            <button class="copy-btn" data-code="${code.number}" aria-label="Copy code ${code.number}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
          <div class="code-number">${code.number}</div>
          <div class="code-subtitle">Unique code • generator</div>
          <div class="stats-row">
            <div class="stat">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              Used ${formattedUsed}
            </div>
            <div class="stat">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
              ${code.rating}
            </div>
          </div>
          <div class="target-badge ${badgeClass}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            Targeted Increase ${code.percentage}%
          </div>
          <button class="buy-btn" data-id="${code.id}" data-code="${code.number}" onclick="window.location.href='get.html'">
            <span class="btn-text">Buy Now</span>
          </button>
        </div>
      `;
    }).join('');

    attachCardListeners();
  }

  function attachCardListeners() {
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const code = btn.dataset.code;
        navigator.clipboard.writeText(code).then(() => {
          showToast(`Copied ${code}`, 'success');
        }).catch(() => {
          showToast('Failed to copy', 'error');
        });
      });
    });

    document.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const btnEl = e.currentTarget;
        const code = btnEl.dataset.code;
        
        if (btnEl.classList.contains('loading') || btnEl.classList.contains('success')) return;
        
        btnEl.classList.add('loading');
        btnEl.innerHTML = '<span class="spinner"></span>';
        
        // Simulate API call
        await new Promise(resolve => setTimeout(resolve, 1200));
        
        btnEl.classList.remove('loading');
        btnEl.classList.add('success');
        btnEl.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span style="margin-left: 8px;">Purchased</span>
        `;
        
        showToast(`Successfully purchased code ${code}`, 'success');
        
        setTimeout(() => {
          btnEl.classList.remove('success');
          btnEl.innerHTML = '<span class="btn-text">Buy Now</span>';
        }, 3000);
      });
    });
  }

  // Search with debounce
  const debounce = (fn, delay) => {
    let timeout;
    return (...args) => {
      clearTimeout(timeout);
      timeout = setTimeout(() => fn(...args), delay);
    };
  };

  const handleSearch = debounce((query) => {
    searchQuery = query.toLowerCase();
    filterAndSort();
  }, 300);

  searchInput.addEventListener('input', (e) => {
    handleSearch(e.target.value);
  });

  // Sort
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentSort = chip.dataset.sort;
      filterAndSort();
    });
  });

  function filterAndSort() {
    filteredCodes = codes.filter(code => 
      code.number.includes(searchQuery) || 
      searchQuery === ''
    );

    switch(currentSort) {
      case 'high':
        filteredCodes.sort((a, b) => b.percentage - a.percentage);
        break;
      case 'low':
        filteredCodes.sort((a, b) => a.percentage - b.percentage);
        break;
      case 'code':
        filteredCodes.sort((a, b) => a.number.localeCompare(b.number));
        break;
      case 'new':
        filteredCodes.sort((a, b) => b.id - a.id);
        break;
    }

    renderCards();
  }

  // Toast
  function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        ${type === 'success' 
          ? '<polyline points="20 6 9 17 4 12"></polyline>' 
          : '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'}
      </svg>
      ${message}
    `;
    
    toastContainer.appendChild(toast);
    
    setTimeout(() => {
      toast.style.animation = 'slideDown 0.3s ease forwards';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  // Keyboard nav
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  // Init
  filterAndSort();

  // Filter button demo
  document.getElementById('filterBtn').addEventListener('click', () => {
    showToast('Advanced filters coming soon', 'success');
  });
</script>
