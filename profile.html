<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Wallet - Main</title>
<style>
    :root {
        --primary: #2563EB;
        --primary-dark: #1D4ED8;
        --success: #10B981;
        --danger: #EF4444;
        --radius-xl: 1.5rem;
        --radius-2xl: 1.25rem;
        --radius-3xl: 1.75rem;
        --transition: 300ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Light Theme */
    body.light {
        --bg: #F8FAFC;
        --bg-secondary: #F1F5F9;
        --card: rgba(255, 255, 255, 0.75);
        --card-hover: rgba(255, 255, 255, 0.9);
        --text: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --border: rgba(226, 232, 240, 0.6);
        --shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
        --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.12);
        --nav-bg: rgba(255, 255, 255, 0.8);
    }

    /* Dark Theme */
    body.dark {
        --bg: #0F172A;
        --bg-secondary: #1E293B;
        --card: rgba(30, 41, 59, 0.75);
        --card-hover: rgba(30, 41, 59, 0.9);
        --text: #F1F5F9;
        --text-secondary: #CBD5E1;
        --text-muted: #94A3B8;
        --border: rgba(51, 65, 85, 0.6);
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
        --nav-bg: rgba(15, 23, 42, 0.8);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background-color var(--transition), color var(--transition);
        min-height: 100vh;
        padding-bottom: 100px;
    }

    .container {
        max-width: 428px;
        margin: 0 auto;
        padding: 0 16px;
        position: relative;
    }

    /* Glassmorphism Base */
    .glass {
        background: var(--card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        transition: all var(--transition);
    }

    /* Header */
    header {
        position: sticky;
        top: 0;
        z-index: 40;
        padding: 16px 0;
        background: var(--card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        margin: 0 -16px 24px;
        padding-left: 16px;
        padding-right: 16px;
    }

    .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
    }

    .wallet-dropdown {
        position: relative;
    }

    .wallet-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: var(--radius-2xl);
        background: var(--bg-secondary);
        border: none;
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: transform 100ms ease;
        max-width: 160px;
    }

    .wallet-btn:active {
        transform: scale(0.95);
    }

    .wallet-btn span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .chevron {
        width: 16px;
        height: 16px;
        transition: transform 200ms ease;
        flex-shrink: 0;
    }

    .dropdown-open .chevron {
        transform: rotate(180deg);
    }

    .dropdown-menu {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        min-width: 200px;
        padding: 8px;
        border-radius: var(--radius-2xl);
        background: var(--card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        opacity: 0;
        transform: translateY(-8px) scale(0.95);
        transition: all 200ms ease;
        pointer-events: none;
        z-index: 50;
    }

    .dropdown-open .dropdown-menu {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }

    .dropdown-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: var(--radius-xl);
        border: none;
        background: transparent;
        color: var(--text);
        width: 100%;
        text-align: left;
        cursor: pointer;
        transition: background-color 150ms ease;
    }

    .dropdown-item:hover {
        background: rgba(37, 99, 235, 0.1);
    }

    .dropdown-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-2xl);
        border: none;
        background: var(--bg-secondary);
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 100ms ease;
        position: relative;
    }

    .icon-btn:active {
        transform: scale(0.9);
    }

    .icon-btn svg {
        width: 20px;
        height: 20px;
    }

    .notification-badge {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 8px;
        height: 8px;
        background: #EF4444;
        border-radius: 50%;
        border: 2px solid var(--bg-secondary);
    }

    .avatar {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-2xl);
        cursor: pointer;
    }

    /* Main Balance Card */
    .balance-card {
        padding: 24px;
        border-radius: var(--radius-3xl);
        background: var(--card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        margin-bottom: 24px;
        transition: transform 200ms ease, box-shadow 200ms ease;
    }

    .balance-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
    }

    .balance-label {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 8px;
    }

    .balance-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 16px;
    }

    .balance-amount {
        font-size: 40px;
        font-weight: 700;
        line-height: 1;
    }

    .balance-badge {
        padding: 4px 12px;
        border-radius: 999px;
        background: linear-gradient(135deg, #2563EB, #1D4ED8);
        color: white;
        font-size: 14px;
        font-weight: 600;
    }

    .balance-change {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
    }

    .balance-change svg {
        width: 16px;
        height: 16px;
    }

    .text-danger {
        color: #EF4444;
    }

    .text-success {
        color: #10B981;
    }

    .text-muted {
        color: var(--text-muted);
    }

    /* Quick Actions */
    .quick-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 24px;
    }

    .action-btn {
        padding: 20px 12px;
        border-radius: var(--radius-3xl);
        background: var(--card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        transition: transform 100ms ease, box-shadow 200ms ease;
        position: relative;
        overflow: hidden;
        border: none;
    }

    .action-btn:active {
        transform: scale(0.95);
    }

    .action-btn:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
    }

    .action-icon {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-2xl);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .action-icon svg {
        width: 24px;
        height: 24px;
        color: white;
    }

    .action-label {
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
    }

    /* Ripple Effect */
    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        transform: scale(0);
        animation: ripple-animation 600ms ease-out;
        pointer-events: none;
    }

    @keyframes ripple-animation {
        to {
            transform: scale(4);
            opacity: 0;
        }
    }

    /* Tabs */
    .tabs-container {
        padding: 6px;
        border-radius: var(--radius-3xl);
        background: var(--card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        position: relative;
        margin-bottom: 20px;
    }

    .tabs-inner {
        display: flex;
        position: relative;
    }

    .tab-slider {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background: linear-gradient(135deg, #2563EB, #1D4ED8);
        border-radius: var(--radius-2xl);
        transition: transform var(--transition);
        z-index: 1;
    }

    .tab-btn {
        flex: 1;
        padding: 12px 16px;
        border-radius: var(--radius-2xl);
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        position: relative;
        z-index: 2;
        transition: color 200ms ease;
    }

    .tab-btn.active {
        color: white;
    }

    /* Content Cards */
    .content-card {
        padding: 20px;
        border-radius: var(--radius-3xl);
        background: var(--card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        margin-bottom: 16px;
        transition: transform 200ms ease, box-shadow 200ms ease;
        animation: fadeIn 300ms ease-out;
    }

    .content-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(8px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .coin-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .coin-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .coin-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-2xl);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: white;
        flex-shrink: 0;
    }

    .coin-name {
        font-weight: 500;
        font-size: 16px;
    }

    .coin-symbol {
        font-size: 12px;
        color: var(--text-muted);
    }

    .coin-price {
        text-align: right;
    }

    .coin-value {
        font-weight: 600;
        font-size: 16px;
    }

    .coin-change {
        font-size: 12px;
        font-weight: 500;
    }

    .sparkline {
        width: 100%;
        height: 48px;
    }

    .sparkline path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw 1.5s ease-out forwards;
    }

    @keyframes draw {
        to { stroke-dashoffset: 0; }
    }

    .funds-card {
        padding: 24px;
        border-radius: var(--radius-3xl);
        background: var(--card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        transition: transform 200ms ease, box-shadow 200ms ease;
    }

    .funds-amount {
        font-size: 32px;
        font-weight: 700;
        margin: 8px 0 12px;
    }

    .funds-chart {
        width: 100%;
        height: 64px;
        margin-top: 16px;
    }

    /* Skeleton Loading */
    .skeleton {
        background: linear-gradient(90deg, 
            rgba(148, 163, 184, 0.1) 25%, 
            rgba(148, 163, 184, 0.2) 50%, 
            rgba(148, 163, 184, 0.1) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 8px;
    }

    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    /* FAB */
    .fab-container {
        position: fixed;
        bottom: 90px;
        right: 16px;
        z-index: 50;
    }

    .fab-menu {
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-end;
        gap: 12px;
        margin-bottom: 12px;
    }

    .fab-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: var(--radius-2xl);
        background: var(--card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        border: none;
        cursor: pointer;
        opacity: 0;
        transform: translateY(16px) scale(0.8);
        transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
        white-space: nowrap;
    }

    .fab-open .fab-item {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }

    .fab-open .fab-item:nth-child(1) { transition-delay: 50ms; }
    .fab-open .fab-item:nth-child(2) { transition-delay: 100ms; }
    .fab-open .fab-item:nth-child(3) { transition-delay: 150ms; }

    .fab-label {
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
    }

    .fab-icon-box {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-xl);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .fab-icon-box svg {
        width: 20px;
        height: 20px;
        color: white;
    }

    .fab-main {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-2xl);
        background: linear-gradient(135deg, #2563EB, #1D4ED8);
        box-shadow: var(--shadow-lg);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 100ms ease;
    }

    .fab-main:active {
        transform: scale(0.9);
    }

    .fab-main svg {
        width: 24px;
        height: 24px;
        color: white;
        transition: transform 300ms ease;
    }

    .fab-open .fab-main svg {
        transform: rotate(45deg);
    }

    /* Bottom Navigation */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 40;
        padding: 8px 16px 16px;
    }

    .nav-container {
        max-width: 428px;
        margin: 0 auto;
        padding: 8px;
        border-radius: var(--radius-3xl);
        background: var(--nav-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
    }

    .nav-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
    }

    .nav-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 12px 8px;
        border-radius: var(--radius-2xl);
        border: none;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 200ms ease;
    }

    .nav-btn:active {
        transform: scale(0.95);
    }

    .nav-btn.active {
        background: linear-gradient(135deg, #2563EB, #1D4ED8);
        color: white;
    }

    .nav-btn svg {
        width: 20px;
        height: 20px;
    }

    .nav-btn span {
        font-size: 11px;
        font-weight: 500;
    }

    .hidden {
        display: none !important;
    }

    .gradient-primary {
        background: linear-gradient(135deg, #2563EB, #1D4ED8);
    }

    .gradient-orange {
        background: linear-gradient(135deg, #F97316, #EF4444);
    }

    .gradient-green {
        background: linear-gradient(135deg, #10B981, #059669);
    }

    .gradient-purple {
        background: linear-gradient(135deg, #A855F7, #EC4899);
    }

    .gradient-bitcoin {
        background: linear-gradient(135deg, #F7931A, #FFAB00);
    }

    .gradient-eth {
        background: linear-gradient(135deg, #627EEA, #8E8EEE);
    }
</style>
</head>

<script>
(function() {
    // Theme Management
    const body = document.body;
    const themeToggle = document.getElementById('themeToggle');
    const lightIcon = document.querySelector('.light-icon');
    const darkIcon = document.querySelector('.dark-icon');
    
    function setTheme(theme) {
        if (theme === 'dark') {
            body.classList.remove('light');
            body.classList.add('dark');
            lightIcon.classList.add('hidden');
            darkIcon.classList.remove('hidden');
        } else {
            body.classList.remove('dark');
            body.classList.add('light');
            lightIcon.classList.remove('hidden');
            darkIcon.classList.add('hidden');
        }
        localStorage.setItem('codex-theme', theme);
    }
    
    const savedTheme = localStorage.getItem('codex-theme') || 
                       (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    setTheme(savedTheme);
    
    themeToggle.addEventListener('click', () => {
        const newTheme = body.classList.contains('light') ? 'dark' : 'light';
        setTheme(newTheme);
    });

    // Count Up Animation
    function animateCountUp(element, target, duration) {
        const start = 0;
        const increment = target / (duration / 16);
        let current = start;
        
        const timer = setInterval(() => {
            current += increment;
            if (current >= target) {
                current = target;
                clearInterval(timer);
            }
            element.textContent = '$' + Math.floor(current).toLocaleString();
        }, 16);
    }
    
    setTimeout(() => {
        const countEl = document.getElementById('balanceCounter');
        animateCountUp(countEl, 1000, 1500);
    }, 100);

    // Wallet Dropdown
    const walletDropdown = document.getElementById('walletDropdown');
    const walletBtn = document.getElementById('walletBtn');
    
    walletBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        walletDropdown.classList.toggle('dropdown-open');
    });
    
    document.addEventListener('click', () => {
        walletDropdown.classList.remove('dropdown-open');
    });

    // Ripple Effect
    document.querySelectorAll('.action-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('ripple');
            
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    });

    // Tabs
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabSlider = document.getElementById('tabSlider');
    const coinsContent = document.getElementById('coinsContent');
    const fundsContent = document.getElementById('fundsContent');
    
    tabBtns.forEach((btn, index) => {
        btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            tabSlider.style.transform = `translateX(${index * 100}%)`;
            
            if (btn.dataset.tab === 'coins') {
                fundsContent.classList.add('hidden');
                coinsContent.classList.remove('hidden');
            } else {
                coinsContent.classList.add('hidden');
                fundsContent.classList.remove('hidden');
            }
        });
    });

    // FAB Menu
    const fabContainer = document.getElementById('fabContainer');
    const fabMain = document.getElementById('fabMain');
    let fabOpen = false;
    
    fabMain.addEventListener('click', (e) => {
        e.stopPropagation();
        fabOpen = !fabOpen;
        fabContainer.classList.toggle('fab-open', fabOpen);
    });
    
    document.addEventListener('click', () => {
        if (fabOpen) {
            fabOpen = false;
            fabContainer.classList.remove('fab-open');
        }
    });

    // Bottom Navigation
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });

})();
</script>
