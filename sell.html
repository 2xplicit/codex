<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Exchange - Sell Astro</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --blue: #3B82F6;
    --emerald: #10B981;
    --emerald-dark: #059669;
    --red: #EF4444;
    --bg: #020617;
    --card: #0F172A;
    --card-border: #1E293B;
    --text: #F1F5F9;
    --text-muted: #94A3B8;
    --light-bg: #F8FAFC;
    --light-card: #FFFFFF;
    --light-border: #E2E8F0;
    --light-text: #0F172A;
    --light-muted: #64748B;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --card-border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #64748B;
    }
  }

  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  * {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  .safe-top { padding-top: env(safe-area-inset-top); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

  .glass {
    background: color-mix(in srgb, var(--card) 85%, transparent);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
  }

  .gradient-border {
    position: relative;
    background: var(--card);
    border-radius: 32px;
  }

  .gradient-border::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 32px;
    padding: 1px;
    background: conic-gradient(from var(--angle), var(--blue), var(--emerald), var(--blue));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: rotate 6s linear infinite;
    opacity: 0.6;
  }

  @keyframes rotate {
    to { --angle: 360deg; }
  }

  .btn-emerald {
    background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
    box-shadow: 0 8px 24px -8px color-mix(in srgb, var(--emerald) 50%, transparent);
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }

  .btn-emerald:active:not(:disabled) {
    transform: scale(0.96);
  }

  .btn-emerald:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .pulse::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: inherit;
    background: inherit;
    animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    z-index: -1;
  }

  @keyframes pulse-ring {
    0%, 100% { opacity: 0; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(1.05); }
  }

  .touch-target {
    min-width: 48px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .key {
    transform: translateZ(0);
    will-change: transform;
    transition: transform 0.1s ease, background 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .key:active {
    transform: scale(0.95);
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transform: scale(0);
    animation: ripple 0.6s ease-out;
    pointer-events: none;
  }

  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }

  .amount-input {
    font-size: 64px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.03em;
    caret-color: var(--emerald);
  }

  @media (max-width: 380px) {
    .amount-input { font-size: 48px; }
  }

  .blinking-cursor::after {
    content: '|';
    display: inline-block;
    animation: blink 1s step-end infinite;
    color: var(--emerald);
    margin-left: 2px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .shake {
    animation: shake 0.4s cubic-bezier(.36,.07,.19,.97);
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }

  .badge-verify {
    background: linear-gradient(135deg, var(--blue), #60A5FA);
  }

  .bottom-sheet {
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  }

  .bottom-sheet.active {
    transform: translateY(0);
  }

  .backdrop {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
  }

  .backdrop.active {
    opacity: 1;
    visibility: visible;
  }

  .spinner {
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .checkmark {
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: draw 0.6s ease-out forwards 0.3s;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: var(--emerald);
    pointer-events: none;
    opacity: 0;
    animation: confetti-fall 2s ease-out forwards;
  }

  @keyframes confetti-fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(80vh) rotate(720deg); }
  }

  .toast {
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  .segmented {
    background: color-mix(in srgb, var(--card-border) 50%, transparent);
    padding: 4px;
  }

  .segmented button {
    transition: all 0.2s ease;
  }

  .segmented button.active {
    background: var(--card);
    box-shadow: 0 2px 8px -2px rgba(0,0,0,0.2);
  }

  .dropdown {
    transform: scale(0.95) translateY(-10px);
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s cubic-bezier(0.32, 0.72, 0, 1);
  }

  .dropdown.active {
    transform: scale(1) translateY(0);
    opacity: 1;
    visibility: visible;
  }

  .copy-feedback {
    transition: all 0.3s ease;
  }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

<script>
  const state = {
    amount: '0',
    unit: 'ASTRO',
    astroBalance: 3756,
    usdBalance: 1568,
    astroPrice: 0.42,
    wallet: '8d969eef6ecad3c2',
    isProcessing: false
  };

  const els = {
    amountDisplay: document.getElementById('amountDisplay'),
    unitToggle: document.getElementById('unitToggle'),
    usdEquivalent: document.getElementById('usdEquivalent'),
    sendApproveBtn: document.getElementById('sendApproveBtn'),
    maxBtn: document.getElementById('maxBtn'),
    errorMsg: document.getElementById('errorMsg'),
    errorText: document.getElementById('errorText'),
    amountContainer: document.getElementById('amountContainer'),
    copyBtn: document.getElementById('copyBtn'),
    copyIcon: document.getElementById('copyIcon'),
    checkIcon: document.getElementById('checkIcon'),
    toast: document.getElementById('toast'),
    toastText: document.getElementById('toastText'),
    liveRegion: document.getElementById('liveRegion'),
    bottomSheet: document.getElementById('bottomSheet'),
    backdrop: document.getElementById('backdrop'),
    cancelBtn: document.getElementById('cancelBtn'),
    confirmBtn: document.getElementById('confirmBtn'),
    confirmAmount: document.getElementById('confirmAmount'),
    confirmUsd: document.getElementById('confirmUsd'),
    confirmTotal: document.getElementById('confirmTotal'),
    backBtn: document.getElementById('backBtn'),
    sellBtn: document.getElementById('sellBtn'),
    sellBtnText: document.getElementById('sellBtnText'),
    publicTab: document.getElementById('publicTab'),
    emailTab: document.getElementById('emailTab'),
    deleteKey: document.getElementById('deleteKey')
  };

  function formatNumber(num) {
    const parts = num.toString().split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return parts.join('.');
  }

  function animateCount(el, start, end, duration = 300) {
    const range = end - start;
    const increment = range / (duration / 16);
    let current = start;
    const timer = setInterval(() => {
      current += increment;
      if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
        current = end;
        clearInterval(timer);
      }
      el.textContent = formatNumber(current.toFixed(2));
    }, 16);
  }

  function updateDisplay() {
    const displayAmount = state.amount === '' ? '0' : state.amount;
    els.amountDisplay.textContent = formatNumber(displayAmount);
    
    let usdValue = 0;
    if (state.unit === 'ASTRO') {
      usdValue = parseFloat(displayAmount) * state.astroPrice;
    } else {
      usdValue = parseFloat(displayAmount);
    }
    
    animateCount(els.usdEquivalent, parseFloat(els.usdEquivalent.textContent.replace(/,/g, '')) || 0, usdValue);
    
    const astroAmount = state.unit === 'ASTRO' ? parseFloat(displayAmount) : parseFloat(displayAmount) / state.astroPrice;
    const isValid = astroAmount > 0 && astroAmount <= state.astroBalance;
    
    els.sendApproveBtn.disabled = !isValid || state.isProcessing;
    
    if (astroAmount > state.astroBalance && displayAmount !== '0') {
      els.errorMsg.classList.remove('hidden');
      els.errorText.textContent = 'Insufficient balance';
      els.amountContainer.classList.add('shake');
      setTimeout(() => els.amountContainer.classList.remove('shake'), 400);
      els.liveRegion.textContent = 'Insufficient balance';
    } else {
      els.errorMsg.classList.add('hidden');
    }
  }

  function createRipple(e) {
    const button = e.currentTarget;
    const ripple = document.createElement('span');
    const rect = button.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;
    
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.classList.add('ripple');
    
    button.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
    
    if ('vibrate' in navigator) navigator.vibrate(10);
  }

  document.querySelectorAll('.key').forEach(key => {
    key.addEventListener('click', (e) => {
      createRipple(e);
      const value = e.currentTarget.dataset.key;
      
      if (value === '.' && state.amount.includes('.')) return;
      if (state.amount === '0' && value !== '.') {
        state.amount = value;
      } else if (state.amount.length < 12) {
        state.amount += value;
      }
      updateDisplay();
      els.liveRegion.textContent = `Amount: ${state.amount} ${state.unit}`;
    });
  });

  let deleteInterval;
  els.deleteKey.addEventListener('touchstart', startDelete);
  els.deleteKey.addEventListener('mousedown', startDelete);
  els.deleteKey.addEventListener('touchend', stopDelete);
  els.deleteKey.addEventListener('mouseup', stopDelete);
  els.deleteKey.addEventListener('mouseleave', stopDelete);

  function startDelete(e) {
    createRipple(e);
    handleDelete();
    deleteInterval = setTimeout(() => {
      deleteInterval = setInterval(handleDelete, 100);
    }, 500);
  }

  function stopDelete() {
    clearTimeout(deleteInterval);
    clearInterval(deleteInterval);
  }

  function handleDelete() {
    if (state.amount.length > 1) {
      state.amount = state.amount.slice(0, -1);
    } else {
      state.amount = '0';
    }
    updateDisplay();
  }

  els.maxBtn.addEventListener('click', (e) => {
    createRipple(e);
    if (state.unit === 'ASTRO') {
      state.amount = state.astroBalance.toString();
    } else {
      state.amount = (state.astroBalance * state.astroPrice).toFixed(2);
    }
    updateDisplay();
    els.amountContainer.style.transform = 'scale(1.02)';
    setTimeout(() => els.amountContainer.style.transform = '', 200);
  });

  els.unitToggle.addEventListener('click', (e) => {
    createRipple(e);
    if (state.unit === 'ASTRO') {
      state.unit = 'USD';
      state.amount = (parseFloat(state.amount) * state.astroPrice).toFixed(2);
    } else {
      state.unit = 'ASTRO';
      state.amount = (parseFloat(state.amount) / state.astroPrice).toString();
    }
    els.unitToggle.textContent = state.unit;
    updateDisplay();
  });

  els.copyBtn.addEventListener('click', async (e) => {
    createRipple(e);
    try {
      await navigator.clipboard.writeText(state.wallet);
      els.copyIcon.classList.add('hidden');
      els.checkIcon.classList.remove('hidden');
      showToast('Wallet address copied!');
      setTimeout(() => {
        els.copyIcon.classList.remove('hidden');
        els.checkIcon.classList.add('hidden');
      }, 2000);
    } catch (err) {
      showToast('Failed to copy', true);
    }
  });

  function showToast(msg, isError = false) {
    els.toastText.textContent = msg;
    els.toast.style.borderColor = isError ? 'var(--red)' : 'var(--emerald)';
    els.toast.classList.add('show');
    els.liveRegion.textContent = msg;
    setTimeout(() => els.toast.classList.remove('show'), 3000);
  }

  els.sendApproveBtn.addEventListener('click', (e) => {
    createRipple(e);
    const astroAmount = state.unit === 'ASTRO' ? parseFloat(state.amount) : parseFloat(state.amount) / state.astroPrice;
    const usdAmount = astroAmount * state.astroPrice;
    
    els.confirmAmount.textContent = formatNumber(astroAmount.toFixed(2));
    els.confirmUsd.textContent = formatNumber(usdAmount.toFixed(2));
    els.confirmTotal.textContent = formatNumber((usdAmount + 0.02).toFixed(2));
    
    els.backdrop.classList.add('active');
    els.bottomSheet.classList.add('active');
    els.liveRegion.textContent = 'Confirmation sheet opened';
  });

  els.cancelBtn.addEventListener('click', closeBottomSheet);
  els.backdrop.addEventListener('click', closeBottomSheet);

  function closeBottomSheet() {
    els.bottomSheet.classList.remove('active');
    els.backdrop.classList.remove('active');
  }

  els.confirmBtn.addEventListener('click', async (e) => {
    createRipple(e);
    state.isProcessing = true;
    els.confirmBtn.disabled = true;
    els.confirmBtn.innerHTML = '<svg class="spinner mx-auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10" opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>';
    
    await new Promise(r => setTimeout(r, 2000));
    
    els.confirmBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path class="checkmark" d="M20 6L9 17l-5-5"/></svg>';
    
    createConfetti();
    if ('vibrate' in navigator) navigator.vibrate([100, 50, 100]);
    
    setTimeout(() => {
      closeBottomSheet();
      showToast('Transaction submitted successfully!');
      state.amount = '0';
      updateDisplay();
      state.isProcessing = false;
      els.confirmBtn.disabled = false;
      els.confirmBtn.innerHTML = '<span id="confirmBtnText">Confirm</span>';
    }, 1500);
  });

  function createConfetti() {
    const colors = ['#10B981', '#3B82F6', '#F59E0B', '#EF4444', '#8B5CF6'];
    for (let i = 0; i < 50; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + '%';
      confetti.style.top = '-10px';
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDelay = Math.random() * 0.5 + 's';
      confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 2000);
    }
  }

  els.backBtn.addEventListener('click', (e) => {
    createRipple(e);
    showToast('Navigating back...');
  });

  els.sellBtn.addEventListener('click', (e) => {
    createRipple(e);
    if (state.isProcessing) return;
    els.sellBtnText.textContent = 'Processing...';
    setTimeout(() => {
      els.sellBtnText.textContent = 'Sell';
      showToast('Sell order placed!');
    }, 1500);
  });

  els.publicTab.addEventListener('click', () => {
    els.publicTab.classList.add('active');
    els.emailTab.classList.remove('active');
    els.publicTab.setAttribute('aria-selected', 'true');
    els.emailTab.setAttribute('aria-selected', 'false');
  });

  els.emailTab.addEventListener('click', () => {
    els.emailTab.classList.add('active');
    els.publicTab.classList.remove('active');
    els.emailTab.setAttribute('aria-selected', 'true');
    els.publicTab.setAttribute('aria-selected', 'false');
  });

  updateDisplay();
</script>
