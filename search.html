<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Search - Modern UI</title>
<style>
  :root {
    --primary: #2563EB;
    --primary-rgb: 37, 99, 235;
    --bg: #f8fafc;
    --bg-elev: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.7);
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow: rgba(15, 23, 42, 0.08);
    --green: #10b981;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  [data-theme="dark"] {
    --bg: #0f172a;
    --bg-elev: #1e293b;
    --bg-glass: rgba(30, 41, 59, 0.7);
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --shadow: rgba(0, 0, 0, 0.3);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background var(--transition), color var(--transition);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .app {
    max-width: 480px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 24px 16px 12px;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    transition: all var(--transition);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .logo svg {
    width: 32px;
    height: 32px;
    color: var(--primary);
  }

  .theme-toggle {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
  }

  .theme-toggle:active {
    transform: scale(0.94);
  }

  .theme-toggle svg {
    width: 20px;
    height: 20px;
    transition: all var(--transition);
  }

  /* Search Bar */
  .search-wrapper {
    position: relative;
    margin-bottom: 12px;
  }

  .search-input-group {
    position: relative;
    transition: all var(--transition);
  }

  .search-input {
    width: 100%;
    height: 56px;
    padding: 16px 48px 16px 48px;
    background: var(--bg-elev);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: all var(--transition);
  }

  .search-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.15);
  }

  .search-input-group.focused .search-label,
  .search-input-group.has-value .search-label {
    transform: translateY(-24px) scale(0.85);
    color: var(--primary);
    background: var(--bg-elev);
    padding: 0 6px;
  }

  .search-label {
    position: absolute;
    left: 48px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    transition: all var(--transition);
    transform-origin: left center;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: var(--text-muted);
    pointer-events: none;
  }

  .clear-btn {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--border);
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
  }

  .clear-btn.show {
    display: flex;
  }

  .clear-btn:active {
    transform: translateY(-50%) scale(0.9);
  }

  .clear-btn svg {
    width: 14px;
    height: 14px;
    color: var(--text-muted);
  }

  /* Suggestions Dropdown */
  .suggestions {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 40px var(--shadow);
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: all var(--transition);
    z-index: 50;
  }

  .suggestions.show {
    max-height: 400px;
    opacity: 1;
    padding: 8px;
  }

  .suggestions-content {
    max-height: 384px;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .suggestions-content::-webkit-scrollbar {
    width: 6px;
  }

  .suggestions-content::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .suggestion-section {
    padding: 8px 4px;
  }

  .suggestion-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    padding: 0 12px 8px;
  }

  .suggestion-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: none;
    text-align: left;
    cursor: pointer;
    transition: all var(--transition);
    color: var(--text);
    font-size: 14px;
  }

  .suggestion-item:active {
    transform: scale(0.98);
    background: var(--border);
  }

  .suggestion-item svg {
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .suggestion-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0 12px 8px;
  }

  .suggestion-chip {
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
  }

  .suggestion-chip:active {
    transform: scale(0.95);
  }

  .suggestion-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  /* Filter Chips */
  .filter-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }

  .filter-chips::-webkit-scrollbar {
    display: none;
  }

  .filter-chip {
    padding: 10px 18px;
    border-radius: var(--radius-md);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    cursor: pointer;
    transition: all var(--transition);
  }

  .filter-chip:active {
    transform: scale(0.96);
  }

  .filter-chip.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  /* Main Content */
  .main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
  }

  .main::-webkit-scrollbar {
    width: 6px;
  }

  .main::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  /* Empty State */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    text-align: center;
    animation: fadeIn 0.3s ease-out;
  }

  .empty-state.hide {
    display: none;
  }

  .empty-illustration {
    width: 180px;
    height: 180px;
    margin-bottom: 24px;
    opacity: 0.9;
  }

  .empty-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .empty-text {
    font-size: 14px;
    color: var(--text-muted);
    max-width: 280px;
    line-height: 1.5;
  }

  /* Results */
  .results {
    display: none;
    flex-direction: column;
    gap: 12px;
  }

  .results.show {
    display: flex;
  }

  .result-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all var(--transition);
    animation: slideUp 0.3s ease-out backwards;
  }

  .result-card:active {
    transform: translateY(2px) scale(0.98);
  }

  .result-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .result-icon.user {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
  }

  .result-icon.coin {
    background: rgba(var(--primary-rgb), 0.1);
    color: var(--primary);
  }

  .result-icon.tx {
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .result-content {
    flex: 1;
    min-width: 0;
  }

  .result-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
  }

  .result-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-meta {
    text-align: right;
    flex-shrink: 0;
  }

  .result-value {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
  }

  .result-change {
    font-size: 12px;
    font-weight: 500;
  }

  .result-change.positive {
    color: var(--green);
  }

  .result-arrow {
    width: 20px;
    height: 20px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* Virtual Keyboard */
  .keyboard {
    position: absolute;
    bottom: 72px;
    left: 0;
    right: 0;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    padding: 8px;
    transform: translateY(100%);
    opacity: 0;
    transition: all var(--transition);
    z-index: 90;
  }

  .keyboard.show {
    transform: translateY(0);
    opacity: 1;
  }

  .keyboard-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    justify-content: center;
  }

  .keyboard-row:last-child {
    margin-bottom: 0;
  }

  .key {
    flex: 1;
    height: 44px;
    border-radius: var(--radius-sm);
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s ease;
    user-select: none;
  }

  .key:active {
    transform: scale(0.92);
    background: rgba(var(--primary-rgb), 0.2);
  }

  .key.special {
    flex: 0 0 56px;
    font-size: 12px;
  }

  .key.space {
    flex: 3;
  }

  .key.return {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .key.shift.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .key svg {
    width: 18px;
    height: 18px;
  }

  /* Bottom Navigation */
  .bottom-nav {
    position: sticky;
    bottom: 0;
    z-index: 100;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 72px;
    padding: 0 8px;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 20px;
    border-radius: var(--radius-md);
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    transition: all var(--transition);
    position: relative;
  }

  .nav-item:active {
    transform: scale(0.95);
  }

  .nav-item.active {
    color: var(--primary);
  }

  .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    background: var(--primary);
    border-radius: 50%;
  }

  .nav-item svg {
    width: 24px;
    height: 24px;
  }

  .nav-item span {
    font-size: 11px;
    font-weight: 500;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes scaleIn {
    from {
      opacity: 0;
      transform: scale(0.95);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* No Results */
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .no-results svg {
    width: 64px;
    height: 64px;
    margin-bottom: 16px;
    opacity: 0.5;
  }
</style>
</head>

      ],
      transactions: [
        { id: 1, type: 'Sent', amount: '$1,250.00', to: 'john@codex.io', time: '2h ago', icon: '↑' },
        { id: 2, type: 'Received', amount: '$850.00', from: 'sarah@crypto.com', time: '5h ago', icon: '↓' },
        { id: 3, type: 'Swap', amount: '0.5 BTC → 12.5 ETH', time: '1d ago', icon: '⇄' }
      ]
    };

    const popularCoins = ['Bitcoin BTC', 'Ethereum ETH', 'Solana SOL', 'Cardano ADA'];
    const suggestedAmounts = ['$100', '$500', '$1,000', '$5,000'];

    // DOM Elements
    const body = document.body;
    const searchInput = document.getElementById('searchInput');
    const searchGroup = document.getElementById('searchGroup');
    const clearBtn = document.getElementById('clearBtn');
    const suggestions = document.getElementById('suggestions');
    const suggestionsContent = suggestions.querySelector('.suggestions-content');
    const emptyState = document.getElementById('emptyState');
    const results = document.getElementById('results');
    const keyboard = document.getElementById('keyboard');
    const themeToggle = document.getElementById('themeToggle');
    const sunPath = document.getElementById('sunPath');
    const moonPath = document.getElementById('moonPath');

    // Initialize Theme
    function initTheme() {
      const saved = localStorage.getItem('codex-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      isDark = saved ? saved === 'dark' : prefersDark;
      updateTheme();
    }

    function updateTheme() {
      body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      sunPath.style.display = isDark ? 'block' : 'none';
      moonPath.style.display = isDark ? 'none' : 'block';
      localStorage.setItem('codex-theme', isDark ? 'dark' : 'light');
    }

    themeToggle.addEventListener('click', function() {
      isDark = !isDark;
      updateTheme();
    });

    // Search Input Handlers
    searchInput.addEventListener('focus', function() {
      searchGroup.classList.add('focused');
      showSuggestions();
      keyboard.classList.add('show');
    });

    searchInput.addEventListener('blur', function() {
      setTimeout(function() {
        searchGroup.classList.remove('focused');
        suggestions.classList.remove('show');
      }, 200);
    });

    searchInput.addEventListener('input', function(e) {
      const value = e.target.value;
      searchGroup.classList.toggle('has-value', value.length > 0);
      clearBtn.classList.toggle('show', value.length > 0);

      if (value.length > 0) {
        performSearch(value);
      } else {
        showSuggestions();
        emptyState.classList.remove('hide');
        results.classList.remove('show');
      }
    });

    clearBtn.addEventListener('click', function() {
      searchInput.value = '';
      searchInput.focus();
      searchGroup.classList.remove('has-value');
      clearBtn.classList.remove('show');
      emptyState.classList.remove('hide');
      results.classList.remove('show');
      showSuggestions();
    });

    // Show Suggestions
    function showSuggestions() {
      let html = '';

      // Recent Searches
      html += '<div class="suggestion-section">';
      html += '<div class="suggestion-title">Recent</div>';
      recentSearches.forEach(function(item) {
        html += '<button class="suggestion-item" data-value="' + item + '">';
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';
        html += '<span>' + item + '</span>';
        html += '</button>';
      });
      html += '</div>';

      html += '<div class="suggestion-divider"></div>';

      // Popular Coins
      html += '<div class="suggestion-section">';
      html += '<div class="suggestion-title">Popular coins</div>';
      popularCoins.forEach(function(item) {
        html += '<button class="suggestion-item" data-value="' + item + '">';
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>';
        html += '<span>' + item + '</span>';
        html += '</button>';
      });
      html += '</div>';

      html += '<div class="suggestion-divider"></div>';

      // Suggested Amounts
      html += '<div class="suggestion-section">';
      html += '<div class="suggestion-title">Suggested amounts</div>';
      html += '<div class="suggestion-chips">';
      suggestedAmounts.forEach(function(item) {
        html += '<button class="suggestion-chip" data-value="' + item + '">' + item + '</button>';
      });
      html += '</div></div>';

      suggestionsContent.innerHTML = html;
      suggestions.classList.add('show');

      // Add click handlers
      suggestionsContent.querySelectorAll('[data-value]').forEach(function(el) {
        el.addEventListener('click', function() {
          const value = this.getAttribute('data-value');
          searchInput.value = value;
          searchGroup.classList.add('has-value');
          clearBtn.classList.add('show');
          performSearch(value);
          suggestions.classList.remove('show');
          searchInput.focus();
        });
      });
    }

    // Perform Search
    function performSearch(query) {
      const q = query.toLowerCase();
      let searchResults = [];

      if (currentFilter === 'all' || currentFilter === 'users') {
        mockData.users.filter(function(u) {
          return u.name.toLowerCase().indexOf(q) !== -1 || u.email.toLowerCase().indexOf(q) !== -1;
        }).forEach(function(u) {
          searchResults.push(Object.assign({}, u, { type: 'user' }));
        });
      }

      if (currentFilter === 'all' || currentFilter === 'coins') {
        mockData.coins.filter(function(c) {
          return c.name.toLowerCase().indexOf(q) !== -1 || c.symbol.toLowerCase().indexOf(q) !== -1;
        }).forEach(function(c) {
          searchResults.push(Object.assign({}, c, { type: 'coin' }));
        });
      }

      if (currentFilter === 'all' || currentFilter === 'transactions') {
        mockData.transactions.filter(function(t) {
          return t.amount.toLowerCase().indexOf(q) !== -1 || 
                 (t.to && t.to.toLowerCase().indexOf(q) !== -1) || 
                 (t.from && t.from.toLowerCase().indexOf(q) !== -1);
        }).forEach(function(t) {
          searchResults.push(Object.assign({}, t, { type: 'transaction' }));
        });
      }

      renderResults(searchResults);
      suggestions.classList.remove('show');
    }

    // Render Results
    function renderResults(data) {
      emptyState.classList.add('hide');
      results.classList.add('show');

      if (data.length === 0) {
        results.innerHTML = '<div class="no-results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 15s1.5 2 4 2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg><p>No results found</p></div>';
        return;
      }

      let html = '';
      data.forEach(function(item, i) {
        const delay = i * 50;
        
        if (item.type === 'user') {
          html += '<div class="result-card" style="animation-delay: ' + delay + 'ms">';
          html += '<div class="result-icon user" style="background: ' + item.color + '">' + item.avatar + '</div>';
          html += '<div class="result-content">';
          html += '<div class="result-title">' + item.name + '</div>';
          html += '<div class="result-subtitle">' + item.email + '</div>';
          html += '</div>';
          html += '<svg class="result-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>';
          html += '</div>';
        } else if (item.type === 'coin') {
          html += '<div class="result-card" style="animation-delay: ' + delay + 'ms">';
          html += '<div class="result-icon coin">' + item.icon + '</div>';
          html += '<div class="result-content">';
          html += '<div class="result-title">' + item.name + '</div>';
          html += '<div class="result-subtitle">' + item.symbol + '</div>';
          html += '</div>';
          html += '<div class="result-meta">';
          html += '<div class="result-value">' + item.price + '</div>';
          html += '<div class="result-change positive">' + item.change + '</div>';
          html += '</div>';
          html += '</div>';
        } else {
          html += '<div class="result-card" style="animation-delay: ' + delay + 'ms">';
          html += '<div class="result-icon tx">' + item.icon + '</div>';
          html += '<div class="result-content">';
          html += '<div class="result-title">' + item.type + '</div>';
          html += '<div class="result-subtitle">' + (item.to || item.from || item.amount) + ' · ' + item.time + '</div>';
          html += '</div>';
          html += '<div class="result-meta">';
          html += '<div class="result-value">' + item.amount + '</div>';
          html += '</div>';
          html += '</div>';
        }
      });

      results.innerHTML = html;
    }

    // Filter Chips
    document.querySelectorAll('.filter-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        document.querySelectorAll('.filter-chip').forEach(function(c) {
          c.classList.remove('active');
        });
        this.classList.add('active');
        currentFilter = this.getAttribute('data-filter');

        if (searchInput.value) {
          performSearch(searchInput.value);
        }
      });
    });

    // Virtual Keyboard
    document.querySelectorAll('.key').forEach(function(key) {
      key.addEventListener('click', function() {
        const keyValue = this.getAttribute('data-key');

        // Vibrate if available
        if (navigator.vibrate) navigator.vibrate(10);

        if (keyValue === 'shift') {
          isShift = !isShift;
          this.classList.toggle('active', isShift);
          updateKeyLabels();
        } else if (keyValue === 'backspace') {
          searchInput.value = searchInput.value.slice(0, -1);
          searchInput.dispatchEvent(new Event('input'));
        } else if (keyValue === 'return') {
          keyboard.classList.remove('show');
          searchInput.blur();
          suggestions.classList.remove('show');
        } else if (keyValue === 'space') {
          searchInput.value += ' ';
          searchInput.dispatchEvent(new Event('input'));
        } else if (keyValue === '123') {
          // Number mode - simplified, just add text
        } else if (keyValue === '@' || keyValue === '.') {
          searchInput.value += keyValue;
          searchInput.dispatchEvent(new Event('input'));
        } else {
          const char = isShift ? keyValue.toUpperCase() : keyValue;
          searchInput.value += char;
          searchInput.dispatchEvent(new Event('input'));
        }

        searchInput.focus();
      });
    });

    function updateKeyLabels() {
      document.querySelectorAll('.key[data-key]').forEach(function(key) {
        const keyValue = key.getAttribute('data-key');
        if (keyValue.length === 1 && keyValue !== '@' && keyValue !== '.') {
          key.textContent = isShift ? keyValue.toUpperCase() : keyValue;
        }
      });
    }

    // Bottom Navigation
    document.querySelectorAll('.nav-item').forEach(function(item) {
      item.addEventListener('click', function() {
        document.querySelectorAll('.nav-item').forEach(function(i) {
          i.classList.remove('active');
        });
        this.classList.add('active');

        if (this.getAttribute('data-nav') !== 'search') {
          keyboard.classList.remove('show');
        }
      });
    });

    // Click outside handlers
    document.addEventListener('click', function(e) {
      if (!keyboard.contains(e.target) && !searchInput.contains(e.target)) {
        keyboard.classList.remove('show');
      }
    });

    // Initialize
    initTheme();
  })();
</script>
